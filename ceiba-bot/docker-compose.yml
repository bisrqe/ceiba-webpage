# Arranque con Docker en un solo comando:  docker compose up --build
# Requiere un archivo .env (copia .env.example).
services:
  ceiba-bot:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data          # base de datos e índice persisten fuera del contenedor
      - ./content:/app/content    # editar YAML sin reconstruir (luego POST /admin/reload)
    restart: unless-stopped
