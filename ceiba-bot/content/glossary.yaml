# =============================================================================
# content/glossary.yaml · GLOSARIO (responde "¿qué es X?")
# -----------------------------------------------------------------------------
# key    → identificador sin espacios.
# term   → cómo se escribe el término.
# alias  → otras formas en que la gente lo escribe (siglas, inglés, sin acentos).
# def    → definición completa.   simple → para niñas y niños (modo «aprender»).
# =============================================================================

terms:
  cmnucc:
    term: "CMNUCC"
    alias: ["unfccc", "convencion marco", "convencion de cambio climatico", "ccnucc"]
    def: "Convención Marco de las Naciones Unidas sobre el Cambio Climático: el tratado internacional en el que los países negocian cómo enfrentar el cambio climático. En inglés, UNFCCC."
    simple: "La gran reunión de países de la ONU para ponerse de acuerdo sobre el clima."
  cop:
    term: "COP"
    alias: ["conferencia de las partes", "cumbre del clima"]
    def: "Conferencia de las Partes: la reunión anual de máxima decisión de la CMNUCC. La COP31 se celebra en Antalya, Türkiye, del 9 al 20 de noviembre de 2026."
    simple: "La reunión más grande del año sobre el clima."
  sb:
    term: "SB (Órganos Subsidiarios)"
    alias: ["organos subsidiarios", "sesiones de bonn", "sb64", "sbsta", "sbi"]
    def: "Sesiones técnicas de la CMNUCC que preparan las decisiones de la COP. Se celebran a mitad de año en Bonn, Alemania. Los dos órganos permanentes son el SBSTA (asesoría científica y tecnológica) y el SBI (implementación)."
    simple: "Reuniones de preparación antes de la COP."
  incidencia:
    term: "Incidencia"
    alias: ["incidir", "advocacy"]
    def: "Acciones organizadas para influir en decisiones públicas o institucionales: leyes, programas, presupuestos o prácticas."
    simple: "Convencer con argumentos a quienes toman decisiones."
  politica:
    term: "Política pública"
    alias: ["politicas publicas"]
    def: "Decisiones y acciones del gobierno para atender un problema público, como una ley, un programa o un reglamento."
    simple: "Las reglas y programas que hace el gobierno para resolver problemas."
  sostenibilidad:
    term: "Sostenibilidad"
    alias: ["sustentabilidad", "desarrollo sostenible"]
    def: "Satisfacer las necesidades del presente sin comprometer la capacidad de las generaciones futuras para satisfacer las suyas."
    simple: "Usar lo que necesitamos hoy sin dejar sin nada a quienes vienen después."
  gobernanza:
    term: "Gobernanza climática"
    alias: ["gobernanza"]
    def: "La forma en que gobiernos, empresas, sociedad civil y academia toman y coordinan decisiones sobre el clima."
    simple: "Cómo se organizan todos para decidir sobre el clima."
  ndc:
    term: "NDC"
    alias: ["contribuciones determinadas a nivel nacional", "contribucion nacional"]
    def: "Contribuciones Determinadas a nivel Nacional: los planes climáticos que cada país presenta bajo el Acuerdo de París y actualiza cada cinco años."
    simple: "La promesa de cada país sobre lo que hará para cuidar el clima."
  ipcc:
    term: "IPCC"
    alias: ["panel intergubernamental", "grupo intergubernamental de expertos"]
    def: "Grupo Intergubernamental de Expertos sobre el Cambio Climático: evalúa la ciencia del clima y publica informes de evaluación. Hoy trabaja en su séptimo ciclo (AR7)."
    simple: "Científicos de todo el mundo que revisan lo que sabemos del clima."
  glf:
    term: "GLF"
    alias: ["global leaders for the future", "global leaders"]
    def: "Global Leaders for the Future: programa con el que CEIBA capacitó a estudiantes rumbo a la SB64."
    simple: "Un grupo de estudiantes líderes que viajan a reuniones internacionales."
  teoria:
    term: "Teoría del cambio"
    alias: ["teoria de cambio"]
    def: "Explicación paso a paso de cómo las actividades de una iniciativa producen los resultados y el impacto que se buscan."
    simple: "El mapa que explica cómo tu idea va a lograr el cambio."
  ong:
    term: "ONG"
    alias: ["organizacion no gubernamental", "observadores"]
    def: "Organización No Gubernamental. En la CMNUCC, las organizaciones observadoras pueden asistir, dar seguimiento y hacer aportaciones a las negociaciones."
    simple: "Grupos de personas que no son gobierno y trabajan por una causa."
