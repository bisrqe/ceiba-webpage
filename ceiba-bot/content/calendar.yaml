# =============================================================================
# content/calendar.yaml · CALENDARIO ANUAL (ciclo agosto → julio)
# -----------------------------------------------------------------------------
# m = número de mes (1 = enero … 12 = diciembre).
# cat = internacionales | semanatec | anual  (debe existir en programs.yaml)
# date = fecha exacta opcional en formato AAAA-MM-DD. Si la pones, el bot la muestra;
#        si no, solo dice el mes.
#
# AGREGAR UN EVENTO: añade una línea dentro de `events` del mes correspondiente:
#   - { label: "Nombre del evento", cat: anual, date: "2027-02-15" }
# =============================================================================

cycle: "2026-2027"        # EDITA AQUÍ el ciclo vigente

periods:
  p1: "Primer periodo · Investigación y diseño (agosto a diciembre)"
  p2: "Segundo periodo · Implementación e impacto (enero a julio)"

months:
  - { m: 8,  name: "Agosto",     period: p1, events: [] }
  - { m: 9,  name: "Septiembre", period: p1, events: [ { label: "Semana Tec", cat: semanatec } ] }
  - { m: 10, name: "Octubre",    period: p1, events: [ { label: "Capacitación rumbo a la COP", cat: internacionales } ] }
  - { m: 11, name: "Noviembre",  period: p1, events: [ { label: "COP31 en Antalya, Türkiye", cat: internacionales, date: "2026-11-09", date_end: "2026-11-20" }, { label: "Semana Tec", cat: semanatec } ] }
  - { m: 12, name: "Diciembre",  period: p1, events: [] }
  - { m: 1,  name: "Enero",      period: p2, events: [] }
  - { m: 2,  name: "Febrero",    period: p2, events: [] }
  - { m: 3,  name: "Marzo",      period: p2, events: [ { label: "Semana Tec", cat: semanatec } ] }
  - { m: 4,  name: "Abril",      period: p2, events: [] }
  - { m: 5,  name: "Mayo",       period: p2, events: [ { label: "Capacitación rumbo a la SB (Bonn)", cat: internacionales }, { label: "Semana Tec", cat: semanatec } ] }
  - { m: 6,  name: "Junio",      period: p2, events: [ { label: "Sesiones SB en Bonn, Alemania", cat: internacionales } ] }
  - { m: 7,  name: "Julio",      period: p2, events: [] }
