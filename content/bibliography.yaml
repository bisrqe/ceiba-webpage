# =============================================================================
# content/bibliography.yaml · BIBLIOTECA CLIMÁTICA (fuente de verdad del RAG)
# -----------------------------------------------------------------------------
# El bot SOLO responde preguntas de contenido climático con lo que hay aquí
# (y con el texto completo descargado por scripts/ingest_bibliography.py).
# Si algo no está, lo dice y no inventa.
#
# Campos de cada documento:
#   id          → único, sin espacios.
#   title       → título oficial.        title_es → título en español para mostrar.
#   publisher   → UNFCCC | IPCC | …      year → año del documento o evento.
#   type        → tratado | conferencia | guia | ciencia | institucional
#   lang        → idioma del documento original (en, es, fr).
#   level       → basico | intermedio | avanzado  (para recomendar según el perfil)
#   tags        → temas (deben coincidir con menus.yaml → library_topics.topic)
#   programs    → programas para los que es más útil (internacionales, semanatec, anual)
#   url         → enlace oficial.        pdf → true si el enlace es un PDF descargable
#   summary_es  → resumen propio en español (2 a 3 frases). Se muestra en la tarjeta.
#   key_facts   → datos verificables y breves. Son lo que el bot cita si el texto
#                 completo no se ha descargado. NO agregues datos sin revisar la fuente.
#   keywords    → palabras clave en español e inglés para la búsqueda.
#   ingest      → true = el script descarga y trocea el texto completo para el RAG.
#   verified_on → fecha en que alguien del equipo revisó el enlace y los datos.
#   added_by    → user (lista original) | sugerencia (propuesto, validar antes de publicar)
#
# AGREGAR UN DOCUMENTO: copia un bloque completo, llena los campos y ejecuta
#   python scripts/validate_content.py
#   python scripts/ingest_bibliography.py      (descarga el texto para el RAG)
# =============================================================================

documents:
  # ------------------------------------------------------------ Fundamentos
  - id: cmnucc_convencion
    title: "United Nations Framework Convention on Climate Change"
    title_es: "Convención Marco de las Naciones Unidas sobre el Cambio Climático (1992)"
    publisher: UNFCCC
    year: 1992
    type: tratado
    lang: en
    level: basico
    tags: [fundamentos, tratados]
    programs: [internacionales, semanatec, anual]
    url: "https://unfccc.int/process-and-meetings/united-nations-framework-convention-on-climate-change"
    pdf: false
    summary_es: >
      El tratado que da origen a toda la negociación climática de la ONU. Fija el
      objetivo de estabilizar los gases de efecto invernadero en un nivel que evite una
      interferencia peligrosa con el sistema climático.
    key_facts:
      - "Se abrió a firma en la Cumbre de la Tierra de Río de Janeiro en 1992 y entró en vigor el 21 de marzo de 1994."
      - "Su órgano supremo es la Conferencia de las Partes (COP), que se reúne cada año."
      - "Su objetivo es estabilizar las concentraciones de gases de efecto invernadero en un nivel que impida interferencias peligrosas en el sistema climático."
    keywords: ["convencion", "cmnucc", "unfccc", "1992", "rio", "objetivo", "partes", "convention"]
    ingest: true
    verified_on: "2026-10-12"
    added_by: user

