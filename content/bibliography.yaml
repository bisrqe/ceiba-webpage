  - id: acuerdo_paris
    title: "L'Accord de Paris"
    title_es: "Acuerdo de París (2015)"
    publisher: UNFCCC
    year: 2015
    type: tratado
    lang: fr
    level: intermedio
    tags: [tratados]
    programs: [internacionales, semanatec, anual]
    url: "https://unfccc.int/fr/a-propos-des-ndcs/l-accord-de-paris"
    pdf: false
    summary_es: >
      El tratado vigente que guía la acción climática mundial: limitar el calentamiento
      muy por debajo de 2 °C y esforzarse por 1.5 °C, con planes nacionales (NDC) que
      se actualizan cada cinco años. La página oficial enlazada está en francés.
    key_facts:
      - "Se adoptó en la COP21 el 12 de diciembre de 2015 y entró en vigor el 4 de noviembre de 2016."
      - "Busca mantener el aumento de temperatura muy por debajo de 2 °C y proseguir esfuerzos para limitarlo a 1.5 °C."
      - "Cada país presenta Contribuciones Determinadas a nivel Nacional (NDC) cada cinco años, cada vez más ambiciosas."
      - "Incluye un Balance Mundial (Global Stocktake) cada cinco años; el primero concluyó en la COP28 (2023)."
    keywords: ["paris", "acuerdo de paris", "paris agreement", "accord de paris", "ndc", "1.5", "2 grados", "balance mundial", "global stocktake", "transparencia"]
    ingest: true
    verified_on: "2026-10-12"
    added_by: user

