    summary_es: >
      Primer tratado con metas obligatorias de reducción de emisiones para países
      industrializados. Introdujo los mercados de carbono.
    key_facts:
      - "Se adoptó el 11 de diciembre de 1997 y entró en vigor el 16 de febrero de 2005."
      - "Fijó metas vinculantes de reducción de emisiones para países industrializados y economías en transición."
      - "Creó mecanismos de mercado: comercio de emisiones, Mecanismo para un Desarrollo Limpio (MDL) e Implementación Conjunta."
      - "La Enmienda de Doha estableció un segundo periodo de compromiso, de 2013 a 2020."
    keywords: ["kioto", "kyoto", "protocolo", "metas vinculantes", "mercado de carbono", "mdl", "cdm", "doha", "anexo i"]
    ingest: true
    verified_on: "2026-10-12"
