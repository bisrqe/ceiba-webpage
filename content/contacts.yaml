# =============================================================================
# content/contacts.yaml · CONTACTOS y NIVELES DE ATENCIÓN
# -----------------------------------------------------------------------------
# ⚠️ Aquí van datos de contacto INSTITUCIONALES (correos y teléfonos de oficina).
#    No pongas números o correos personales sin el consentimiento de la persona.
# ⚠️ Las CLAVES de API y contraseñas NUNCA van aquí: van en el archivo .env
#    (ver .env.example y docs/03_CONECTIVIDAD.md).
#
# Valor `null` = dato pendiente. El bot dirá «Por definir» y ofrecerá el contacto
# general de CEIBA en su lugar.
# =============================================================================

# ---------------------------------------------------------------------------
# Contacto general de CEIBA (nivel 3: coordinación del programa)
# ---------------------------------------------------------------------------
general:
  name: "Coordinación CEIBA"
  email: null            # EDITA AQUÍ el correo donde la coordinación recibe consultas (ej. "ceiba@tec.mx")
  phone: null            # EDITA AQUÍ el teléfono de oficina, formato internacional (ej. "+52 81 0000 0000")
  whatsapp: null         # EDITA AQUÍ el número de WhatsApp Business de CEIBA, solo dígitos con lada (ej. "5281XXXXXXXX")
  hours: "Lunes a viernes, 9:00 a 17:00 (hora del centro de México)"   # EDITA AQUÍ el horario de atención
  privacy_url: null      # EDITA AQUÍ la URL del aviso de privacidad publicado
  form_url: null         # EDITA AQUÍ la URL del formulario oficial de inscripción (si es distinto del sitio)

# ---------------------------------------------------------------------------
# Niveles de atención (quién responde cada tipo de duda)
# ---------------------------------------------------------------------------
support_levels:
  - level: 1
    who: "Página web y CEIBA bot"
    scope: "Reglas de la convocatoria y conceptos básicos de cada temática"
    examples: "Monto, fechas, rubros no financiables, qué es un empujón verde, qué pide el formulario"
    source: "Banco de preguntas (content/faq.yaml) y biblioteca (content/bibliography.yaml)"
  - level: 2
    who: "Secretaría del campus"
    scope: "Dudas sobre la propuesta concreta del estudiante, espacios del campus o personas del campus"
    examples: "¿Es viable mi propuesta?, ¿puedo usar el auditorio?, ¿con qué profesor hablo?"
    source: "Contactos por campus (abajo)"
  - level: 3
    who: "Coordinación CEIBA"
    scope: "Casos no resueltos en los niveles 1 y 2, alianzas, prensa, temas institucionales"
    examples: "Convenios, solicitudes de medios, quejas"
    source: "Contacto general (arriba)"

