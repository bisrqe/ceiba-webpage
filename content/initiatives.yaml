# content/initiatives.yaml · TIPOS DE INICIATIVA (3 sectores × 3 tipos)
# -----------------------------------------------------------------------------
# Mismo contenido que la sección «Iniciativas» del sitio web.
# status: prop = texto por validar (en la fuente original estaba incompleto o repetido).
# =============================================================================

sectors:
  - id: publico
    emoji: "🏛️"
    title: "Sector público"
    def: "Proyectos que buscan influir en la gestión gubernamental y optimizar normativas, programas operativos y regulaciones."
    simple: "Ideas para mejorar las reglas y los programas del gobierno."
    types:
      - { title: "Intervenciones urbanas / política pública", status: prop, example: "Proponer al municipio una ruta ciclista segura cerca de una escuela." }
      - { title: "Sociedad civil", example: "Un colectivo vecinal que pide y cuida nuevas áreas verdes junto con su alcaldía." }
      - { title: "Academia", example: "Un estudio sobre islas de calor que termina en recomendaciones para el ayuntamiento." }

  - id: privado
    emoji: "🏢"
    title: "Sector privado"
    def: "Iniciativas que transforman prácticas, modelos de negocio o cadenas de valor en empresas."
    simple: "Ideas para que las empresas contaminen menos y cuiden más el ambiente."
    types:
      - { title: "PyMEs", example: "Ayudar a una panadería de barrio a reducir su consumo de gas y electricidad." }
      - { title: "Grandes empresas", example: "Proponer a una empresa que mida y publique su huella de carbono." }
      - { title: "Startups sostenibles", example: "Crear una empresa que convierta residuos de cosecha en empaques." }

  - id: mixto
    emoji: "🤝"
    title: "Sector público-privado"
    def: "Propuestas que articulan gobierno y empresas para un problema que ninguno resolvería solo."
    simple: "Ideas en las que el gobierno y las empresas trabajan juntos porque solos no podrían."
    types:
      - { title: "Infraestructura y servicios sostenibles", status: prop, example: "Una planta solar concesionada que abastece al alumbrado público." }
      - { title: "Financiamiento verde", example: "Bonos verdes que financian autobuses eléctricos." }
      - { title: "Cadenas de valor sostenibles", example: "Un distintivo oficial que motiva a restaurantes a comprar a productores locales." }
