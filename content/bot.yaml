# =============================================================================
# content/bot.yaml · Identidad, tono y mensajes fijos de CEIBA bot
# -----------------------------------------------------------------------------
# QUIÉN EDITA: cualquier integrante del equipo (no requiere programar).
# CÓMO: cambia solo el texto entre comillas. No cambies los nombres de las
#       claves (lo que va antes de los dos puntos), el código las busca por nombre.
# FORMATO EN MENSAJES: **negritas** y enlaces [texto](https://...) funcionan en
#       la web y en Telegram. En WhatsApp y Messenger se convierten a texto plano.
# VARIABLES: {nombre}, {bot}, {nivel}, {programa}, {campus} se sustituyen solas.
# =============================================================================

bot:
  name: "CEIBA bot"                       # EDITA AQUÍ el nombre visible del bot
  organization: "CEIBA · Capacitación e Incidencia en Bienestar Ambiental"
  website: "https://claude.ai/artifact/HHdm31CAWet4kcUKewN6Aw"   # EDITA AQUÍ: URL definitiva del sitio web
  language: "es-MX"
  # Tono (lo usa el modelo de lenguaje SOLO si activas LLM_PROVIDER en .env).
  persona: >
    Eres CEIBA bot, el asistente del programa estudiantil CEIBA. Hablas en español de
    México, con calidez y respeto, como una mentora joven que explica sin tecnicismos
    innecesarios. Respondes en bloques cortos, con una idea por párrafo. Nunca inventas
    fechas, montos, nombres ni datos: si algo no está en tus fuentes, lo dices y ofreces
    el contacto adecuado.

# Mensajes del sistema. Cada clave corresponde a un momento de la conversación.
messages:
  greeting: >
    👋 ¡Hola! Soy **{bot}**. Te ayudo a conocer CEIBA, encontrar el programa que va
    contigo y recomendarte lecturas oficiales sobre cambio climático.
    ¿Por dónde empezamos?
  greeting_returning: >
    👋 ¡Qué gusto verte de nuevo{nombre_coma}! La última vez quedamos en **{ultimo_tema}**.
    ¿Seguimos ahí o prefieres otra cosa?
  privacy_notice: >
    🔒 Antes de seguir: guardo tus respuestas para darte seguimiento y recomendaciones.
    No pido datos sensibles. Puedes escribir **borrar mis datos** en cualquier momento.
    [Lee el aviso de privacidad completo]({privacy_url}).
  menu_prompt: "¿Qué te gustaría hacer?"
  fallback: >
    🤔 No estoy segura de haber entendido. Puedes elegir una opción del menú o
    escribir tu pregunta con otras palabras.
  fallback_repeated: >
    Parece que no estoy logrando ayudarte con esto. Te comparto el contacto de una
    persona del equipo que sí puede hacerlo.
  no_source: >
    No encontré esa información en mis fuentes oficiales, así que prefiero no adivinar.
    ¿Te paso con alguien del equipo?
  pending_data: >
    Ese dato todavía no está publicado. En cuanto el equipo lo confirme, aparecerá aquí.
  handoff_ask_campus: "Para pasarte con la persona correcta, ¿en qué campus estudias?"
  handoff_done: >
    Tu pregunta necesita a alguien que conozca tu caso. Te paso con la secretaría de
    **{campus}**:
  data_deleted: "✅ Listo. Borré tu perfil y tu historial de conversación."
  resume_code: >
    Si quieres continuar desde otro dispositivo, escribe este código allá:
    **{codigo}** (vence en {dias} días).
  resume_ok: "✅ Recuperé tu perfil. Seguimos donde te quedaste."
  resume_fail: "No encontré ese código o ya venció. Empecemos de nuevo, no pasa nada."
  goodbye: "🌱 ¡Gracias por pasar! Cuando quieras, aquí estaré."
  typing_hint: "CEIBA bot está escribiendo…"

# Ajustes de experiencia (no técnicos).
ux:
  max_paragraph_chars: 420        # Divide respuestas largas en burbujas más cortas (chunking)
  typing_delay_ms_per_char: 12    # Simula escritura natural en la web (0 = sin pausa)
  typing_delay_max_ms: 1400
  max_cards_per_reply: 3          # No abrumar: máximo 3 lecturas por respuesta
  fallbacks_before_handoff: 2     # Tras N respuestas no entendidas, ofrece contacto humano
