# =============================================================================
# content/programs.yaml · QUIÉNES SOMOS y PROGRAMAS
# -----------------------------------------------------------------------------
# Mismo contenido que el sitio web (src/data/content.js). Si cambias algo en la web,
# cámbialo también aquí para que el bot y el sitio digan lo mismo.
#   text   → versión completa.   simple → versión en palabras sencillas (8 a 14 años).
#   status → done (realizado) | meta (aspiración) | prop (propuesta)
#   web_anchor → sección del sitio a la que el bot enlaza (#programas, #calendario…).
# =============================================================================

about:
  acronym: "Capacitación e Incidencia en Bienestar Ambiental"
  mision:
    text: >
      Experimentar, desarrollar y fortalecer capacidades de incidencia en temas de
      sostenibilidad y cambio climático en estudiantes mediante procesos de formación,
      colaboración y creación de iniciativas orientadas a la transformación sostenible
      de sus territorios.
    simple: "Enseñamos a jóvenes a entender el cambio climático y a proponer ideas reales para cuidar el lugar donde viven."
  vision:
    status: meta
    text: >
      Convertirse en el laboratorio de referencia para la formación de jóvenes
      universitarios que diseñan, prueban y escalan soluciones de política pública
      climática con impacto real en México.
    simple: "Soñamos con ser el mejor lugar de México para que jóvenes universitarios creen reglas y proyectos que protejan el clima."
  objetivo:
    text: >
      Fortalecer las capacidades de incidencia, articulación y liderazgo de la comunidad
      estudiantil para que participen de manera estratégica y efectiva en la gobernanza
      climática, desde espacios internacionales hasta contextos locales y universitarios.
    simple: "Que las y los estudiantes sepan participar y liderar en las decisiones sobre el clima."

programs:
  - id: internacionales
    emoji: "🌎"
    title: "Capacitaciones para eventos internacionales"
    summary: "Cursos especializados para estudiantes que asisten a eventos internacionales de la CMNUCC."
    simple: "Preparamos a estudiantes que viajan a reuniones mundiales sobre el clima."
    audience: >
      Estudiantes universitarios con asistencia o participación confirmada a un evento
      de la Convención Marco de las Naciones Unidas sobre el Cambio Climático (CMNUCC).
    highlights:
      - "**Logro (realizado):** capacitamos a la segunda generación de Global Leaders for the Future (GLF) rumbo a la SB64 en Bonn, Alemania."
      - "**Habilidades:** comunicación estratégica, conocimiento técnico de la CMNUCC y escucha activa e inteligencia cultural."
      - "**Sesiones:** marco CMNUCC/SB/COP, ONG observadoras, herramientas y plataformas, agenda personal con mentoría."
      - "**Medición:** rúbrica de 1 a 4 al inicio y al cierre, más un reporte final."
    reading_tags: ["conferencias", "fundamentos"]
    web_anchor: "#programas"

  - id: semanatec
    emoji: "🌱"
    title: "Semana Tec: Emergencia Climática"
    summary: "Socialización de formas de incidencia en cambio climático y políticas públicas."
    simple: "Una semana en la que equipos de estudiantes inventan soluciones para problemas reales del clima."
    audience: >
      Estudiantes del Tec de Monterrey inscritos en la Semana Tec con Sentido Humano:
      Emergencia Climática, de todas las carreras y semestres.
    highlights:
      - "**Metodología:** equipos multidisciplinarios; cada uno recibe un sector estratégico y una situación problema real."
      - "**Sectores:** sociedad civil, política pública, expresión artística, investigación y divulgación académica, y proyectos ambientales del sector privado."
      - "**Logro (realizado):** de seis iniciativas presentadas, tres pasaron al Programa Anual."
      - "**Mejora:** medimos sensibilización, interés y calidad de las propuestas al inicio y al final."
    reading_tags: ["fundamentos", "tratados"]
    link: null           # EDITA AQUÍ el enlace oficial de inscripción a la Semana Tec
    web_anchor: "#programas"

  - id: anual
    emoji: "💡"
    title: "Programa Anual de Iniciativas Climáticas"
    summary: "Diseño e implementación de políticas públicas con enfoque en sostenibilidad."
    simple: "Durante un año acompañamos a jóvenes para que su idea se convierta en un proyecto real."
    audience: >
      Estudiantes universitarios interesados en política pública o activismo con enfoque
      en cambio climático o sostenibilidad.
    highlights:
      - "**Agosto a diciembre:** diagnóstico, identificación del problema, tipo de iniciativa, metodologías de diseño y validación con aliados."
      - "**Enero a julio:** planeación, indicadores, implementación, vinculación con tomadores de decisión y cierre."
      - "**Niveles:** Básico, Intermedio y Avanzado, según tu diagnóstico de entrada."
    reading_tags: ["tratados", "ciencia"]
    web_anchor: "#programas"
