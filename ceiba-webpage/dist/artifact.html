/* =====================================================================
   CEIBA · Tokens globales de diseño
   ---------------------------------------------------------------------
   ÚNICO lugar donde se definen colores, tipografía y radios.
   Para aplicar la paleta oficial (Canva), reemplaza SOLO los valores
   hexadecimales del bloque :root. Todos los componentes (Shadow DOM)
   heredan estas variables CSS automáticamente.
   ===================================================================== */
:root {
  /* Marca (PALETA PROVISIONAL: sustituir por la de Canva) */
  --c-primary: #1E6B4F;         /* verde ceiba: botones, enlaces activos */
  --c-primary-strong: #14503A;  /* hover / texto sobre suave */
  --c-primary-soft: #DCEEE3;    /* fondos de selección */
  --c-leaf: #3E9B6E;            /* copa del logotipo, detalles */
  --c-trunk: #6B4A2F;           /* tronco del logotipo */
  --c-accent: #F2B33D;          /* sol: resaltados y modo sencillo */
  --c-accent-soft: #FCF0D2;
  --c-accent-ink: #3A2A00;
  --c-sky: #1C6A9C;             /* agua / clima: enlaces e información */
  --c-sky-soft: #DDEBF5;

  /* Neutros con sesgo verde */
  --c-bg: #F3F6F2;
  --c-surface: #FFFFFF;
  --c-surface-2: #E8EFEA;
  --c-ink: #14231C;
  --c-muted: #4B5D54;
  --c-line: #D1DCD4;

  /* Semánticos (independientes de la marca) */
  --c-ok: #22703F;   --c-ok-soft: #E0F2E7;
  --c-warn: #8A5A00; --c-warn-soft: #FBEFD6;
  --c-bad: #B42318;  --c-bad-soft: #FBE3E0;
  --c-focus: #1C6A9C;

  /* Tipografía */
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;

  /* Forma */
  --radius-s: 8px;
  --radius-m: 14px;
  --radius-l: 22px;
  --shadow-1: 0 1px 2px rgb(20 35 28 / .06), 0 4px 14px rgb(20 35 28 / .07);
  --shadow-2: 0 10px 40px rgb(20 35 28 / .18);
  --header-h: 68px;
  --maxw: 1320px;
  /* Movimiento: los componentes usan estas duraciones (heredan en Shadow DOM) */
  --dur: .18s;
  --dur-slow: .6s;

  color-scheme: light;
}

}

  --c-leaf: #4FAF7E; --c-trunk: #B08A67;
  --c-accent: #F5C15A; --c-accent-soft: #3A3017; --c-accent-ink: #FBE7B8;
  --c-sky: #7DBBE6; --c-sky-soft: #17303F;
  --c-bg: #0E1612; --c-surface: #15211B; --c-surface-2: #1C2B24;
  --c-ink: #E4EEE8; --c-muted: #A3B6AB; --c-line: #2C3E35;
  --c-ok: #74D39A; --c-ok-soft: #173325; --c-warn: #F0C065; --c-warn-soft: #3A2E14;

/* Alto contraste (lo activa el usuario desde Accesibilidad) */
:root[data-contrast="high"] {
  --c-primary: #0A3D2A; --c-primary-strong: #000; --c-primary-soft: #FFF3B0;
  --c-sky: #003E73; --c-sky-soft: #FFFFFF;

}

body {
  margin: 0;

@media (prefers-reduced-motion: reduce) { .boot .bar i { animation: none; width: 100%; } }

<script type="module">
import { LitElement, html, css, svg, nothing } from 'https://cdn.jsdelivr.net/npm/lit@3.2.1/+esm';

// ===== src/core/store.js =====
// Estado global mínimo, sin dependencias. Los componentes se suscriben con StoreController.
// Persistencia: SOLO si la persona acepta en el aviso de almacenamiento (consentimiento).

const KEYS = { consent: 'ceiba.consent.v1', prefs: 'ceiba.prefs.v1', data: 'ceiba.data.v1' };
const VIEWS = ['inicio', 'nosotros', 'programas', 'diagnostico', 'iniciativas', 'indicadores', 'calendario', 'testimonios', 'participa'];

function readLS(key) { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch { return null; } }
function writeLS(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; } }
function removeLS(key) { try { localStorage.removeItem(key); } catch { /* sin acceso */ } }

class Store extends EventTarget {
  constructor() {
    super();
    const consent = readLS(KEYS.consent);
    const allowed = consent === 'accepted';
    const prefs = allowed ? readLS(KEYS.prefs) || {} : {};
    const data = allowed ? readLS(KEYS.data) || {} : {};
    const hashView = (location.hash || '').replace('#', '');
    this.state = {
      view: VIEWS.includes(hashView) ? hashView : 'inicio',
      category: 'todas',
      level: '',
      profile: '',
      simple: false,
      contrast: false,
      reduceMotion: false,
      fontScale: 1,
      visited: [],
      results: {},
      idea: { text: '', sector: '', subtype: '' },
      consent,
      ...prefs,
      ...data,
    };
    if (!this.state.visited.includes(this.state.view)) this.state.visited = [...this.state.visited, this.state.view];
    this.applyGlobals();
  }

  get views() { return VIEWS; }

  set(patch) {
    Object.assign(this.state, patch);
    this.persist();
    this.applyGlobals();
    this.dispatchEvent(new CustomEvent('change', { detail: patch }));
  }

  saveResult(diagId, moment, payload) {
    const results = structuredClone(this.state.results || {});
    results[diagId] = results[diagId] || {};
    results[diagId][moment] = { ...payload, date: new Date().toISOString() };
    this.set({ results });
  }

  setConsent(value) {
    this.state.consent = value;
    writeLS(KEYS.consent, value); // guardar la decisión es estrictamente necesario para no volver a preguntar
    if (value !== 'accepted') { removeLS(KEYS.prefs); removeLS(KEYS.data); }
    this.set({});
  }

  clearAll() {
    Object.values(KEYS).forEach(removeLS);
    this.set({ results: {}, idea: { text: '', sector: '', subtype: '' }, visited: [this.state.view], level: '', profile: '', consent: null });
  }

  persist() {
    if (this.state.consent !== 'accepted') return;
    const { simple, contrast, reduceMotion, fontScale, level, profile, visited, category, results, idea } = this.state;
    writeLS(KEYS.prefs, { simple, contrast, reduceMotion, fontScale, level, profile, visited, category });
    writeLS(KEYS.data, { results, idea });
  }

  applyGlobals() {
    const root = document.documentElement;
    root.style.fontSize = `${Math.round(this.state.fontScale * 100)}%`;
    if (this.state.contrast) root.dataset.contrast = 'high'; else delete root.dataset.contrast;
    if (this.state.reduceMotion) root.dataset.motion = 'reduce'; else delete root.dataset.motion;
  }
}

const store = new Store();

// Controlador reactivo de Lit: re-renderiza el componente cuando cambia el estado.
class StoreController {
  constructor(host) {
    this.host = host;
    this._onChange = () => host.requestUpdate();
    host.addController(this);
  }
  hostConnected() { store.addEventListener('change', this._onChange); }
  hostDisconnected() { store.removeEventListener('change', this._onChange); }
}

// ===== src/core/utils.js =====
// ---- Navegación (hash simple: #inicio, #programas, ...) -------------------
function navigate(view, { anchor = '', category = '' } = {}) {
  if (!store.views.includes(view)) view = 'inicio';
  const visited = store.state.visited.includes(view) ? store.state.visited : [...store.state.visited, view];
  const patch = { view, visited };
  if (category) patch.category = category;
  store.set(patch);
  if (location.hash.replace('#', '') !== view) {
    try { history.pushState(null, '', `#${view}`); } catch { location.hash = view; }
  }
  window.dispatchEvent(new CustomEvent('ceiba-navigated', { detail: { view, anchor } }));
}

// ---- Notificaciones -----------------------------------------------------------
// type: 'ok' | 'info' | 'warn' | 'bad'
function toast(message, type = 'info', timeout = 4500) {
  window.dispatchEvent(new CustomEvent('ceiba-toast', { detail: { message, type, timeout } }));
}

// ---- Ventanas legales -----------------------------------------------------------
function openLegal(id) {
  window.dispatchEvent(new CustomEvent('ceiba-legal', { detail: { id } }));
}

// ---- Lectura en voz alta (API nativa del navegador, sin terceros) ---------------
let speaking = false;
function speak(text) {
  if (!('speechSynthesis' in window)) { toast('Tu navegador no permite la lectura en voz alta.', 'warn'); return; }
  if (speaking) { window.speechSynthesis.cancel(); speaking = false; toast('Lectura detenida.', 'info', 2500); return; }
  const clean = (text || '').replace(/\s+/g, ' ').trim();
  if (!clean) return;
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'es-MX';
  u.rate = store.state.simple ? 0.9 : 1;
  u.onend = () => { speaking = false; };
  u.onerror = () => { speaking = false; };
  speaking = true;
  window.speechSynthesis.speak(u);
  toast('Leyendo en voz alta. Presiona «Escuchar» de nuevo para detener.', 'info', 3500);
}

// ---- Portapapeles --------------------------------------------------------------
async function copyText(text, okMsg = 'Copiado al portapapeles.') {
  try {
    await navigator.clipboard.writeText(text);
    toast(okMsg, 'ok', 2500);
    return true;
  } catch {
    toast('No se pudo copiar automáticamente. Selecciona el texto y cópialo manualmente.', 'warn');
    return false;
  }
}

// ---- Texto --------------------------------------------------------------------
const normalize = (s) => (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function formatDate(iso) {
  try { return new Date(iso).toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' }); } catch { return iso; }
}

  .stack { display: flex; flex-direction: column; gap: var(--gap, 1rem); }
  .row { display: flex; flex-wrap: wrap; gap: var(--gap, .75rem); align-items: center; }
  .grid { display: grid; gap: var(--gap, 1rem); grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--min, 250px)), 1fr)); }
  .card { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--radius-m); padding: 1.25rem; }
  .card.soft { background: var(--c-surface-2); border-color: transparent; }
  .muted { color: var(--c-muted); }
  .small { font-size: .9rem; }
  .lead { font-size: 1.15rem; color: var(--c-muted); }
  .num { font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--c-primary); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* Etiquetas de estado: dicen si algo ya ocurrió, es meta o es propuesta (afirmaciones con respaldo) */
  .chip { display: inline-flex; align-items: center; gap: .35rem; font-size: .78rem; font-weight: 700; line-height: 1.2;
    padding: .25rem .6rem; border-radius: 999px; background: var(--c-surface-2); color: var(--c-muted); white-space: nowrap; }
  .chip.done { background: var(--c-ok-soft); color: var(--c-ok); }
  .chip.meta { background: var(--c-sky-soft); color: var(--c-sky); }
  .chip.prop { background: var(--c-warn-soft); color: var(--c-warn); }
  .chip.pending { background: transparent; color: var(--c-warn); border: 1.5px dashed currentColor; }
  .chip.ex { background: var(--c-accent-soft); color: var(--c-accent-ink); }

  /* Cabecera de cada vista */
  .view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--c-line); }
  .view-head .titles { display: flex; flex-direction: column; gap: .5rem; min-width: 0; flex: 1 1 420px; }
  .view-head h2:focus { outline: none; }
  article { display: flex; flex-direction: column; gap: 2rem; }
  section { display: flex; flex-direction: column; gap: 1rem; scroll-margin-top: calc(var(--header-h) + 16px); }

  /* Caja de "modo sencillo" (para niñas y niños o primera visita) */
  .simple-box { display: flex; gap: .85rem; align-items: flex-start; background: var(--c-accent-soft); color: var(--c-ink);
    border-radius: var(--radius-m); padding: .9rem 1.1rem; }
  .simple-box .tag { flex: none; font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    background: var(--c-accent); color: #2a1f00; border-radius: 999px; padding: .25rem .6rem; margin-top: .1rem; }
  .simple-inline { display: block; margin-top: .5rem; padding: .5rem .75rem; border-radius: var(--radius-s); background: var(--c-accent-soft); font-size: .95rem; }

  /* Controles de formulario nativos */
  .field { display: flex; flex-direction: column; gap: .4rem; }
  .field label, .label { font-weight: 700; }
  .hint { font-size: .88rem; color: var(--c-muted); }
  .error { font-size: .9rem; color: var(--c-bad); font-weight: 700; display: flex; gap: .35rem; align-items: center; }
  input[type="text"], input[type="email"], input[type="search"], input[type="url"], input[type="number"], select, textarea {
    width: 100%; min-height: 48px; padding: .7rem .85rem; border-radius: var(--radius-s); border: 1.5px solid var(--c-line);
    background: var(--c-surface); color: var(--c-ink); transition: border-color var(--dur); }
  textarea { min-height: 120px; resize: vertical; }
  input:hover, select:hover, textarea:hover { border-color: var(--c-muted); }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--c-focus); outline-offset: 1px; border-color: var(--c-focus); }
  [aria-invalid="true"] { border-color: var(--c-bad) !important; }
  .choice { display: flex; gap: .7rem; align-items: flex-start; padding: .8rem .95rem; border: 1.5px solid var(--c-line); border-radius: var(--radius-s);
    background: var(--c-surface); cursor: pointer; transition: border-color var(--dur), background var(--dur); min-height: 48px; }
  .choice:hover { border-color: var(--c-primary); }
  .choice:has(input:checked) { border-color: var(--c-primary); background: var(--c-primary-soft); }
  .choice:has(input:focus-visible) { outline: 3px solid var(--c-focus); outline-offset: 2px; }
  .choice input { margin: .2rem 0 0; width: 1.2rem; height: 1.2rem; accent-color: var(--c-primary); flex: none; }
  input[type="checkbox"], input[type="radio"] { accent-color: var(--c-primary); }

  /* Segmentado (radio group con apariencia de botones) */
  .segmented { display: flex; flex-wrap: wrap; gap: .5rem; }
  .segmented button { display: inline-flex; align-items: center; gap: .5rem; min-height: 46px; padding: .55rem 1rem; border-radius: 999px;
    border: 1.5px solid var(--c-line); background: var(--c-surface); cursor: pointer; font-weight: 700; transition: all var(--dur); }
  .segmented button:hover { border-color: var(--c-primary); }
  .segmented button[aria-pressed="true"], .segmented button[aria-selected="true"], .segmented button[aria-checked="true"] {
    background: var(--c-primary); color: var(--c-surface); border-color: var(--c-primary); }

  .flash { animation: flash var(--dur-slow) ease 2; }
  @keyframes flash { 50% { box-shadow: 0 0 0 6px var(--c-accent); } }
  .pending-text { font-style: italic; color: var(--c-warn); }
`;

// Clase base de todas las vistas: suscripción al estado, cabecera estándar,
// explicación en modo sencillo, lectura en voz alta y enfoque de anclas (búsqueda).
class CeibaView extends LitElement {
  static styles = [shared];

  constructor() {
    super();
    this._sc = new StoreController(this);
  }

  get s() { return store.state; }

  head({ eyebrow, title, lead, simple }) {
    return html`
      <header class="view-head">
        <div class="titles">
          <p class="eyebrow">${eyebrow}</p>
          <h2 id="view-title" tabindex="-1">${title}</h2>
          ${lead ? html`<p class="lead">${lead}</p>` : nothing}
        </div>
        <ui-button variant="ghost" size="sm" icon="speaker" a11y-label="Escuchar esta sección en voz alta" @ui-click=${() => this.readAloud()}>Escuchar</ui-button>
      </header>
      ${this.simpleBox(simple)}`;
  }

  simpleBox(text) {
    if (!this.s.simple || !text) return nothing;
    return html`<div class="simple-box" role="note" aria-label="Explicación sencilla"><span class="tag">En sencillo</span><p>${text}</p></div>`;
  }

  simpleInline(text) {
    return this.s.simple && text ? html`<span class="simple-inline">${text}</span>` : nothing;
  }

  readAloud() {
    const el = this.renderRoot.querySelector('article');
    speak(el ? el.innerText : '');
  }

  // La app llama a este método tras navegar desde la búsqueda.
  async focusAnchor(id) {
    await this.updateComplete;
    const target = id ? this.renderRoot.getElementById(id) : this.renderRoot.getElementById('view-title');
    if (!target) return false;
    if (id) target.scrollIntoView({ behavior: store.state.reduceMotion ? 'auto' : 'smooth', block: 'start' });
    if (!target.hasAttribute('tabindex')) target.setAttribute('tabindex', '-1');
    target.focus({ preventScroll: true });
    if (id) {
      target.classList.remove('flash');
      void target.offsetWidth;
      target.classList.add('flash');
    }
    return true;
  }
}

    score(answers) {

// Índice de búsqueda generado a partir del contenido. Cada entrada sabe a qué vista,

function build() {
  const I = [];
  const add = (title, text, view, anchor = '', category = '', kind = 'Sección') => I.push({ title, text, view, anchor, category, kind, hay: normalize(`${title} ${text}`) });

  add('Quiénes somos', 'CEIBA Capacitación e Incidencia en Bienestar Ambiental', 'nosotros', '', '', 'Sección');
  add(ABOUT.mision.title, ABOUT.mision.text, 'nosotros', 'mision');
  add(ABOUT.vision.title, ABOUT.vision.text, 'nosotros', 'vision');
  add(ABOUT.objetivo.title, ABOUT.objetivo.text, 'nosotros', 'objetivo');
  COMPONENTS.forEach((c) => add(c.title, c.text, 'programas', 'top', c.id, 'Programa'));

  add('Público objetivo · Eventos internacionales', P.internacionales.publico, 'programas', 'publico', 'internacionales', 'Programa');
  add(P.internacionales.sb64.title, P.internacionales.sb64.text, 'programas', 'sb64', 'internacionales', 'Programa');
  P.internacionales.skills.forEach((s) => add(s.title, `${s.question} ${s.excellent} ${s.evidence}`, 'programas', 'habilidades', 'internacionales', 'Habilidad'));
  add('Medición e indicadores · niveles 1 a 4', `${P.internacionales.measurement} Inicial En desarrollo Competente Destacado`, 'programas', 'medicion', 'internacionales', 'Programa');
  P.internacionales.sessions.forEach((s) => add(`Sesión ${s.n}: ${s.title}`, s.text, 'programas', 'sesiones', 'internacionales', 'Sesión'));

  add('Semana Tec · público objetivo', P.semanatec.publico, 'programas', 'publico', 'semanatec', 'Programa');
  add('Semana Tec · metodología', `${P.semanatec.metodologia} ${P.semanatec.sectors.join(' ')}`, 'programas', 'metodologia', 'semanatec', 'Programa');
  add('Semana Tec · entrega y medidores', `${P.semanatec.entrega} ${P.semanatec.result.text}`, 'programas', 'entrega', 'semanatec', 'Programa');
  add('Semana Tec · mejora de indicadores', 'Sensibilización Interés Calidad inicial final', 'programas', 'mejora', 'semanatec', 'Programa');

  add('Programa Anual · público objetivo', P.anual.publico, 'programas', 'publico', 'anual', 'Programa');

    sec.items.forEach((it) => add(it.title, it.text, 'iniciativas', `sector-${sec.id}`, '', 'Iniciativa'));
  });

  add('Cadena de resultados', INDICATORS.chain.map((c) => `${c.title} ${c.text}`).join(' '), 'indicadores', 'cadena', '', 'Indicadores');

  add('Testimonios verificados', 'reseñas opiniones experiencias', 'testimonios', '', '', 'Sección');
  Object.values(GLOSSARY).forEach((g) => add(g.term, g.def, 'nosotros', 'glosario', '', 'Glosario'));
  return I;
}

let INDEX = null;
function search(query, limit = 8) {
  const q = normalize(query).trim();
  if (q.length < 2) return [];
  INDEX = INDEX || build();
  const terms = q.split(/\s+/);
  return INDEX
    .map((e) => {
      let score = 0;
      for (const t of terms) {
        if (!e.hay.includes(t)) return null;
        score += normalize(e.title).includes(t) ? 3 : 1;
      }
      return { ...e, score };
    })
    .filter(Boolean)
    .sort((a, b) => b.score - a.score)
    .slice(0, limit);
}

 *    (un <button> dentro de Shadow DOM, por sí solo, NO envía formularios externos).
 *  · `disabled` refleja el atributo: `disabled="false"` en HTML sigue deshabilitando

    a11yLabel: { type: String, attribute: 'a11y-label' },
    disabled: { type: Boolean, reflect: true },
    full: { type: Boolean, reflect: true },
    pressed: { type: String },
    label: { type: String },

  static styles = css`
    :host { display: inline-block; font-family: var(--font-body); }

    button:focus-visible { outline: 3px solid var(--c-focus); outline-offset: 3px; }
    :host([size="sm"]) button { min-height: 44px; padding: .45rem .95rem; font-size: .92rem; }
    :host([size="lg"]) button { min-height: 56px; padding: .9rem 1.8rem; font-size: 1.1rem; }

    .primary { background: var(--c-primary); color: var(--c-surface); }
    .primary:hover:not(:disabled) { background: var(--c-primary-strong); }
    .secondary { background: var(--c-surface); color: var(--c-primary-strong); border-color: var(--c-primary); }
    .secondary:hover:not(:disabled) { background: var(--c-primary-soft); }
    .ghost { background: transparent; color: var(--c-ink); border-color: var(--c-line); }
    .ghost:hover:not(:disabled) { background: var(--c-surface-2); }
    .ghost[aria-pressed="true"] { background: var(--c-primary-soft); border-color: var(--c-primary); }
    .accent { background: var(--c-accent); color: #2a1f00; }
    .accent:hover:not(:disabled) { filter: brightness(.95); }

  `;

  constructor() {
    super();
    this.variant = 'primary';
    this.size = 'md';
    this.type = 'button';
    this.disabled = false;
    this.full = false;
    this.label = '';
    this._internals = this.attachInternals ? this.attachInternals() : null;
  }

  focus(opts) { this.renderRoot?.querySelector('button')?.focus(opts); }

  _onClick(e) {
    if (this.disabled) { e.preventDefault(); e.stopPropagation(); return; }
    const form = this._internals?.form;
    if (form && this.type === 'submit') form.requestSubmit();
    if (form && this.type === 'reset') form.reset();

      detail: { label: this.label || this.textContent.trim(), variant: this.variant },

        part="button"

        ?disabled=${this.disabled}
        aria-label=${this.a11yLabel || nothing}
        aria-pressed=${this.pressed ?? nothing}
        @click=${this._onClick}>
        ${this.icon ? icon(this.icon) : nothing}

        ${this.iconEnd ? icon(this.iconEnd) : nothing}

  }

/**
 * <ui-qr value="https://..." label="..."> · Código QR como Web Component.
 * EJEMPLO DE EXTENSIÓN: así se agrega una capacidad nueva sin tocar el resto del sitio.
 *  1. La librería (qrcode-generator, MIT, ~20 KB) se carga SOLO cuando se usa el componente.
 *  2. El QR se dibuja como SVG propio (sin innerHTML), siempre negro sobre blanco para
 *     que cualquier cámara lo lea, sin importar el tema claro u oscuro.
 * Atributos: value (texto o URL), label (texto alternativo), size (px), ecc = L | M | Q | H
 */
const QR_LIB = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
let libPromise = null;
function loadLib() {
  if (window.qrcode) return Promise.resolve(window.qrcode);
  if (!libPromise) {
    libPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = QR_LIB; s.async = true; s.crossOrigin = 'anonymous';
      s.onload = () => (window.qrcode ? resolve(window.qrcode) : reject(new Error('QR no disponible')));
      s.onerror = () => { libPromise = null; reject(new Error('No se pudo cargar la librería QR')); };
      document.head.appendChild(s);
    });
  }
  return libPromise;
}

class UIQr extends LitElement {
  static properties = {
    value: { type: String }, label: { type: String }, size: { type: Number }, ecc: { type: String },
    _state: { state: true }, _path: { state: true }, _count: { state: true },
  };

  static styles = css`
    :host { display: inline-block; font-family: var(--font-body); }
    .box { display: grid; place-items: center; width: var(--qr-size); height: var(--qr-size); max-width: 100%; aspect-ratio: 1; background: #fff; border-radius: 10px; border: 1px solid var(--c-line); }
    svg { width: 100%; height: 100%; display: block; }
    .msg { padding: .75rem; text-align: center; font-size: .85rem; color: #333; }
    .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #d8e2dc; border-top-color: #1E6B4F; animation: r .8s linear infinite; margin: 0 auto .4rem; }
    @keyframes r { to { transform: rotate(360deg); } }
  `;

  constructor() { super(); this.value = ''; this.label = ''; this.size = 180; this.ecc = 'M'; this._state = 'idle'; this._path = ''; this._count = 0; }

  updated(changed) { if (changed.has('value') || changed.has('ecc')) this._generate(); }

  async _generate() {
    if (!this.value) { this._state = 'empty'; return; }
    this._state = 'loading';
    try {
      const qrcode = await loadLib();
      const qr = qrcode(0, this.ecc || 'M');
      qr.addData(this.value);
      qr.make();
      const n = qr.getModuleCount();
      let d = '';
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
      this._count = n; this._path = d; this._state = 'ready';
      this.dispatchEvent(new CustomEvent('ui-qr-ready', { bubbles: true, composed: true, detail: { value: this.value } }));
    } catch (err) {
      this._state = 'error';
      this.dispatchEvent(new CustomEvent('ui-qr-error', { bubbles: true, composed: true, detail: { message: err.message } }));
    }
  }

  render() {
    const q = 4; // zona de silencio estándar (4 módulos)
    const n = this._count + q * 2;
    return html`<div class="box" style="--qr-size:${this.size}px">
      ${this._state === 'ready' ? html`<svg viewBox="0 0 ${n} ${n}" role="img" aria-label=${this.label || `Código QR que abre: ${this.value}`} shape-rendering="crispEdges">
          ${svg`<rect width=${n} height=${n} fill="#fff"/><path transform="translate(${q} ${q})" d=${this._path} fill="#000"/>`}
        </svg>`
      : this._state === 'loading' ? html`<div class="msg" role="status"><div class="spin" aria-hidden="true"></div>Generando código…</div>`
      : this._state === 'error' ? html`<div class="msg" role="alert">No se pudo generar el QR. Revisa tu conexión e inténtalo de nuevo.</div>`
      : html`<div class="msg">Escribe un enlace para generar el código.</div>`}
    </div>${nothing}`;
  }
}

      background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--radius-m); box-shadow: var(--shadow-2); max-height: 60vh; overflow: auto; }
    li { display: flex; flex-direction: column; gap: .1rem; padding: .6rem .75rem; border-radius: var(--radius-s); cursor: pointer; }
    li + li { margin-top: 2px; }
    li[aria-selected="true"], li:hover { background: var(--c-primary-soft); }
    .k { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--c-primary); }
    .t { font-weight: 700; color: var(--c-ink); }
    .s { font-size: .85rem; color: var(--c-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .empty { padding: .8rem; color: var(--c-muted); font-size: .92rem; }
  `;

  constructor() {
    super(); this._q = ''; this._res = []; this._active = -1; this._open = false;
    this._global = (e) => {
      const tag = (e.composedPath()[0]?.tagName || '').toLowerCase();
      if (e.key === '/' && !['input', 'textarea', 'select'].includes(tag)) { e.preventDefault(); this.focus(); }
    };
    this._outside = (e) => { if (!e.composedPath().includes(this)) this._open = false; };
  }
  connectedCallback() { super.connectedCallback(); window.addEventListener('keydown', this._global); document.addEventListener('pointerdown', this._outside); }
  disconnectedCallback() { window.removeEventListener('keydown', this._global); document.removeEventListener('pointerdown', this._outside); super.disconnectedCallback(); }
  focus() { this.renderRoot.querySelector('input')?.focus(); }

  _input(e) { this._q = e.target.value; this._res = search(this._q); this._active = this._res.length ? 0 : -1; this._open = this._q.trim().length >= 2; }

  _key(e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); this._open = true; this._active = Math.min(this._res.length - 1, this._active + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); this._active = Math.max(0, this._active - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); if (this._res[this._active]) this._go(this._res[this._active]); }
    else if (e.key === 'Escape') { this._open = false; }
  }

  _go(r) {
    this._open = false; this._q = ''; this._res = [];
    this.renderRoot.querySelector('input').value = '';
    this.dispatchEvent(new CustomEvent('ui-search-go', { bubbles: true, composed: true, detail: r }));
    navigate(r.view, { anchor: r.anchor, category: r.category });
  }

  render() {
    const listId = 'res';
    return html`<div class="wrap" role="search">
        ${icon('search', 18)}
        <label class="sr-only" for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Buscar en el sitio</label>
        <input id="q" type="search" placeholder="Buscar: nivel, COP, Semana Tec…" autocomplete="off"
          role="combobox" aria-autocomplete="list" aria-controls=${listId} aria-expanded=${this._open ? 'true' : 'false'}
          aria-activedescendant=${this._open && this._active >= 0 ? `o${this._active}` : nothing}
          .value=${this._q} @input=${this._input} @keydown=${this._key} @focus=${() => { if (this._q.trim().length >= 2) this._open = true; }} />
        ${this._q ? nothing : html`<kbd aria-hidden="true">/</kbd>`}
      </div>
      <ul id=${listId} role="listbox" aria-label="Resultados de búsqueda" ?hidden=${!this._open}>
        ${this._res.length ? this._res.map((r, i) => html`<li id="o${i}" role="option" aria-selected=${i === this._active ? 'true' : 'false'}
            @pointerdown=${(e) => { e.preventDefault(); this._go(r); }}>
            <span class="k">${r.kind}</span><span class="t">${r.title}</span><span class="s">${r.text}</span></li>`)
        : html`<li class="empty" role="option" aria-disabled="true">Sin resultados para «${this._q}». Prueba con «nivel», «COP» o «Semana Tec».</li>`}
      </ul>`;
  }
}

const FONT_STEPS = [0.9, 1, 1.15, 1.3, 1.5];

function setFontStep(dir) {
  const i = FONT_STEPS.indexOf(store.state.fontScale);
  const next = FONT_STEPS[Math.max(0, Math.min(FONT_STEPS.length - 1, (i < 0 ? 1 : i) + dir))];
  store.set({ fontScale: next });
  toast(`Tamaño de letra: ${Math.round(next * 100)} %`, 'info', 1800);
}

  _tabKey(e) {
    const i = TABS.findIndex((t) => t.id === this.tab);
    const map = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
    if (map[e.key]) { e.preventDefault(); this._selectTab(TABS[(i + map[e.key] + TABS.length) % TABS.length].id, true); }
    if (e.key === 'Home') { e.preventDefault(); this._selectTab(TABS[0].id, true); }
    if (e.key === 'End') { e.preventDefault(); this._selectTab(TABS[TABS.length - 1].id, true); }
  }

  _who(text, simple) {
    return html`<section id="publico" aria-labelledby="h-pub"><div class="who">${icon('users', 24)}<div class="stack" style="--gap:.3rem">
      <h3 id="h-pub">Público objetivo</h3><p>${this.s.simple ? simple : text}</p></div></div></section>`;

  _internacionales() {

      ${this._who(P.publico, P.publicoSimple)}

      <section id="habilidades" aria-labelledby="h-hab">
        <h3 id="h-hab">Habilidades a desarrollar</h3>
        <div class="grid" style="--min:250px">${P.skills.map((k) => html`<div class="card skill">
          <h4>${k.title}</h4>${this.simpleInline(k.simple)}
          <p class="q">${k.question}</p>
          <p class="kv"><b>Nivel destacado</b>${k.excellent}</p>
          <p class="kv"><b>Evidencia</b>${k.evidence}</p>
        </div>`)}</div>
      </section>
      <section id="medicion" aria-labelledby="h-med">
        <h3 id="h-med">Medición e indicadores</h3>
        <div class="scale" role="list" aria-label="Escala de competencia">${P.rubric.map((r) => html`<div role="listitem"><b class="num">${r.n}</b>${r.label}</div>`)}</div>
        <p>${P.measurement}</p>
        <div><ui-button icon="clipboard" @ui-click=${() => navigate('diagnostico', { category: 'internacionales' })}>Hacer el diagnóstico de habilidades</ui-button></div>
      </section>
      <section id="sesiones" aria-labelledby="h-ses">
        <h3 id="h-ses">Plan de sesiones impartidas</h3>
        <div>${P.sessions.map((x, i) => html`<details ?open=${i === 0}>
          <summary><span class="num-badge num">${x.n}</span>Sesión ${x.n}: ${x.title}<span class="chev">${icon('chevron')}</span></summary>
          <p>${x.text}</p></details>`)}</div>
      </section>`;
  }

  _semanatec() {
    const P = PROGRAMS.semanatec;
    return html`
      ${this._who(P.publico, P.publicoSimple)}
      <section id="metodologia" aria-labelledby="h-met">
        <h3 id="h-met">Metodología</h3>
        <p>${this.s.simple ? P.metodologiaSimple : P.metodologia}</p>
        <h4>Sectores estratégicos desde los que se hace <ui-term key="incidencia">incidencia</ui-term></h4>
        <div class="row" style="--gap:.5rem">${P.sectors.map((x) => html`<span class="chip" style="font-size:.9rem;padding:.4rem .8rem">${x}</span>`)}</div>
      </section>
      <section id="entrega" aria-labelledby="h-ent">
        <h3 id="h-ent">Entrega y medidores</h3>
        <p>${P.entrega}</p>
        <div class="card stack" style="--gap:.6rem">
          <div class="row"><strong>Resultado de la primera edición</strong><span class="chip done">${icon('check', 14)} Realizado</span></div>
          <div class="dots" role="img" aria-label="${P.result.selected} de ${P.result.presented} iniciativas seleccionadas">
            ${Array.from({ length: P.result.presented }, (_, i) => html`<span class=${i < P.result.selected ? 'on' : ''}></span>`)}</div>
          <p>${P.result.text}</p>
        </div>
      </section>
      <section id="mejora" aria-labelledby="h-mej">
        <div class="row"><h3 id="h-mej">Oportunidad de mejora de indicadores</h3><span class="chip prop">Propuesta</span></div>
        <p>${P.mejora.text}</p>
        <div class="grid" style="--min:200px">${P.mejora.items.map((m) => html`<div class="card"><h4>${m.title}</h4><p class="muted">${m.how}</p></div>`)}</div>
        <div><ui-button icon="clipboard" @ui-click=${() => navigate('diagnostico', { category: 'semanatec' })}>Responder la encuesta de la Semana Tec</ui-button></div>
      </section>
      <section aria-label="Enlace oficial">
        <p class="small muted">Enlace oficial de la Semana Tec: ${COMPONENTS[1].link ? html`<a href=${COMPONENTS[1].link} target="_blank" rel="noopener noreferrer">abrir</a>` : html`<span class="chip pending">Por definir</span>`}</p>
      </section>`;
  }

  _anual() {
    const P = PROGRAMS.anual;
    const s = this.s;
    return html`
      ${this._who(P.publico, P.publicoSimple)}
      <section id="metodologia-anual" aria-labelledby="h-meta">
        <h3 id="h-meta">Metodología del programa</h3>
        <p>${P.metodologia}</p>
      </section>
      <section id="niveles" aria-labelledby="h-niv">
        <h3 id="h-niv">Niveles de participante</h3>
        <div class="grid" style="--min:240px">${LEVELS.map((l) => {
          const mine = s.level === l.id;
          return html`<div class="card level ${mine ? 'mine' : ''}">
            <div class="row" style="justify-content:space-between"><h4>Nivel ${l.label}</h4>${mine ? html`<span class="chip done">${icon('check', 14)} Tu nivel</span>` : nothing}</div>
            <p>${s.simple ? l.simple : l.desc}</p>
            <p class="adv"><strong>Para avanzar:</strong> ${l.advance}</p>
            ${mine ? nothing : html`<div><ui-button variant="ghost" size="sm" @ui-click=${() => { store.set({ level: l.id }); toast(`Nivel ${l.label} guardado como tu nivel.`, 'ok'); }}>Este es mi nivel</ui-button></div>`}
          </div>`;
        })}</div>
        <p class="small muted">¿No sabes cuál es tu nivel? <a href="#diagnostico" @click=${(e) => { e.preventDefault(); navigate('diagnostico', { category: 'anual' }); }}>Haz el diagnóstico de entrada</a>.</p>
      </section>
      <section id="duracion" aria-labelledby="h-dur">
        <h3 id="h-dur">Duración del programa</h3>
        <div class="grid" style="--min:240px">${P.periods.map((p) => html`<div class="card period ${p.id}">
          <span class="eyebrow">${p.months}</span><h4>${p.title}</h4><p class="muted">${p.subtitle}</p></div>`)}</div>
        <div><ui-button variant="secondary" icon="calendar" @ui-click=${() => navigate('calendario', { category: 'anual' })}>Ver calendario anual</ui-button></div>
      </section>
      <section id="tipos" aria-labelledby="h-tip">
        <h3 id="h-tip">Tipos de iniciativas</h3>
        <div class="grid" style="--min:220px">${INITIATIVES.map((i) => html`<div class="card stack" style="--gap:.5rem">
          <div class="row" style="--gap:.5rem">${icon(i.icon)}<h4>${i.title}</h4></div>
          <p class="muted small">${s.simple ? i.simple : i.def}</p>
          <div><ui-button variant="ghost" size="sm" icon-end="arrowR" a11y-label="Explorar iniciativas del ${i.title}" @ui-click=${() => navigate('iniciativas', { anchor: `sector-${i.id}` })}>Explorar</ui-button></div></div>`)}</div>
      </section>
      <section id="acompanamiento" aria-labelledby="h-aco">
        <h3 id="h-aco">Propuesta de acompañamiento</h3>
        <div class="grid" style="--min:280px">${P.accompaniment.map((sem) => html`<div class="card stack">
          <h4>${sem.title}</h4>
          <ol class="steps">${sem.steps.map((st, i) => html`<li><span class="num-badge num">${i + 1}</span><span style="padding-top:.35rem">${st}</span></li>`)}</ol>
        </div>`)}</div>
      </section>`;
  }

  render() {
    const tab = this.tab;
    const comp = COMPONENTS.find((c) => c.id === tab);
    return html`<article>
      ${this.head({ eyebrow: 'Programas · componentes de acción', title: 'Elige un programa', lead: 'Selecciona una categoría para ver su público, su metodología y cómo medimos el avance.', simple: 'Tenemos tres programas. Toca uno para conocerlo.' })}
      <div role="tablist" aria-label="Programas" id="top" @keydown=${this._tabKey}>
        ${TABS.map((t) => html`<button role="tab" id="tab-${t.id}" aria-selected=${t.id === tab ? 'true' : 'false'} aria-controls="panel" tabindex=${t.id === tab ? '0' : '-1'}
          @click=${() => this._selectTab(t.id)}>${icon(t.icon)}${t.label}</button>`)}
      </div>
      <div role="tabpanel" id="panel" aria-labelledby="tab-${tab}" tabindex="0">
        <div class="stack" style="--gap:.4rem"><h2 style="font-size:1.6rem">${comp.title}</h2><p class="lead">${this.s.simple ? comp.simple : comp.text}</p></div>
        ${tab === 'internacionales' ? this._internacionales() : tab === 'semanatec' ? this._semanatec() : this._anual()}
      </div>
    </article>`;
  }
}
customElements.define('view-programas', ViewProgramas);

// ===== src/views/view-diagnostico.js =====
const ORDER = ['anual', 'internacionales', 'semanatec'];
const RUBRIC = PROGRAMS.internacionales.rubric;

class ViewDiagnostico extends CeibaView {
  static properties = { _diag: { state: true }, _moment: { state: true }, _step: { state: true }, _answers: { state: true }, _done: { state: true } };

  static styles = [shared, css`
    .pick { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
    .pick button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: .35rem; padding: 1rem 1.1rem; border-radius: var(--radius-m);
      background: var(--c-surface); border: 2px solid var(--c-line); }
    .pick button:hover { border-color: var(--c-primary); }
    .pick button:focus-visible { outline: 3px solid var(--c-focus); outline-offset: 3px; }
    .pick button[aria-pressed="true"] { border-color: var(--c-primary); background: var(--c-primary-soft); }
    .pick strong { font-family: var(--font-display); font-size: 1.1rem; }
    .pick span { font-size: .9rem; color: var(--c-muted); }
    .pick em { font-style: normal; font-size: .8rem; font-weight: 800; color: var(--c-primary); }
    .stage { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--radius-l); padding: clamp(1.1rem, 3vw, 2rem); display: flex; flex-direction: column; gap: 1.25rem; }
    fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .6rem; min-width: 0; }
    legend { font-family: var(--font-display); font-size: clamp(1.25rem, 1.1rem + .6vw, 1.6rem); font-weight: 700; margin-bottom: .6rem; padding: 0; text-wrap: balance; }
    .choice .lv { display: block; font-weight: 800; }
    .choice.correct { border-color: var(--c-ok); background: var(--c-ok-soft); }
    .choice.wrong { border-color: var(--c-bad); background: var(--c-bad-soft); }
    .fb { display: flex; gap: .6rem; align-items: flex-start; padding: .8rem 1rem; border-radius: var(--radius-s); background: var(--c-sky-soft); }
    .fb.ok { background: var(--c-ok-soft); } .fb.bad { background: var(--c-warn-soft); }
    .nav { display: flex; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
    .range { display: flex; flex-direction: column; gap: .5rem; }
    input[type="range"] { width: 100%; height: 44px; accent-color: var(--c-primary); }
    .range .ends { display: flex; justify-content: space-between; font-size: .9rem; color: var(--c-muted); }
    .range output { align-self: center; font-family: var(--font-display); font-size: 2.4rem; font-weight: 800; color: var(--c-primary); }
    .result-level { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .badge { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.8rem, 1.4rem + 1.6vw, 2.6rem); color: var(--c-primary-strong); background: var(--c-primary-soft); padding: .4rem 1.1rem; border-radius: var(--radius-m); }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: .6rem .5rem; border-bottom: 1px solid var(--c-line); }
    th { font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; color: var(--c-muted); }
    .up { color: var(--c-ok); font-weight: 800; } .down { color: var(--c-bad); font-weight: 800; }
    .tbl { overflow-x: auto; }
    .moments { display: flex; flex-wrap: wrap; gap: .5rem; }
  `];

  constructor() {
    super();
    this._diag = ORDER.includes(store.state.category) ? store.state.category : 'anual';
    this._lastCat = store.state.category;
    this._moment = 'inicial'; this._step = -1; this._answers = {}; this._done = false;
  }

  willUpdate() {
    const cat = this.s.category;
    if (cat !== this._lastCat) {
      this._lastCat = cat;
      if (ORDER.includes(cat) && cat !== this._diag && (this._step === -1 || this._done)) this._reset(cat);
    }
  }

  get D() { return DIAGNOSTICS[this._diag]; }

  _reset(id = this._diag) { this._diag = id; this._step = -1; this._answers = {}; this._done = false; this._moment = 'inicial'; }

  _pick(id) {
    if (this._step >= 0 && !this._done && Object.keys(this._answers).length) toast('Cambiaste de diagnóstico. Tus respuestas anteriores no se guardaron.', 'warn');
    this._reset(id);
    this._lastCat = id;
    store.set({ category: id });
  }

  _answer(q, value) { this._answers = { ...this._answers, [q.id]: value }; }

  _next() {
    const qs = this.D.questions;
    const cur = qs[this._step];
    if (cur?.type === 'scale' && this._answers[cur.id] === undefined) this._answer(cur, Math.round((cur.max - cur.min) / 2));
    if (this._step < qs.length - 1) { this._step += 1; this._focusStage(); return; }
    this._finish();
  }
  _back() { if (this._step > 0) { this._step -= 1; this._focusStage(); } else this._step = -1; }
  _focusStage() { this.updateComplete.then(() => this.renderRoot.querySelector('legend')?.focus?.()); }

  _finish() {
    const summary = this.D.score(this._answers);
    const moment = this.D.moments ? this._moment : 'unico';
    store.saveResult(this._diag, moment, { answers: this._answers, summary });
    this._done = true;
    if (this._diag === 'anual') {
      const lvl = LEVELS.find((l) => l.id === summary.level);
      store.set({ level: summary.level });
      toast(`Diagnóstico completado. Nivel sugerido: ${lvl.label}.`, 'ok');
    } else toast('Respuestas guardadas. ¡Gracias!', 'ok');
    this.updateComplete.then(() => this.renderRoot.querySelector('#result-title')?.focus());
  }

  // ---------- Render: pregunta --------------------------------------------------
  _question(q) {
    const a = this._answers[q.id];
    const answered = a !== undefined && a !== '';
    if (q.type === 'scale') {
      const v = a ?? Math.round((q.max - q.min) / 2);
      return html`<fieldset><legend tabindex="-1">${q.prompt}</legend>
        <div class="range">
          <output for="rng" aria-live="polite">${v}</output>
          <label class="sr-only" for="rng">${q.prompt}</label>
          <input id="rng" type="range" min=${q.min} max=${q.max} step="1" .value=${String(v)} @input=${(e) => this._answer(q, Number(e.target.value))} />
          <div class="ends"><span>${q.min} · ${q.minLabel}</span><span>${q.max} · ${q.maxLabel}</span></div>
        </div>
        ${answered ? nothing : html`<p class="hint">Mueve el control para responder (también funciona con las flechas del teclado).</p>`}
      </fieldset>`;
    }
    const showFb = answered && q.explain;
    const hasCorrect = !!q.correct;
    return html`<fieldset><legend tabindex="-1">${q.prompt}</legend>
      ${q.options.map((o) => {
        let cls = 'choice';
        if (answered && hasCorrect && o.value === q.correct) cls += ' correct';
        if (answered && hasCorrect && a === o.value && o.value !== q.correct && o.value !== 'x') cls += ' wrong';
        return html`<label class=${cls}><input type="radio" name=${q.id} .value=${String(o.value)} .checked=${String(a) === String(o.value)} @change=${() => this._answer(q, o.value)} />
          <span>${o.label ? html`<span class="lv">${o.value} · ${o.label}</span>` : nothing}${o.text}</span></label>`;
      })}
      ${showFb ? html`<div class="fb ${hasCorrect ? (a === q.correct ? 'ok' : 'bad') : ''}" role="status">
        ${icon(hasCorrect && a === q.correct ? 'check' : 'info')}
        <p>${hasCorrect ? html`<strong>${a === q.correct ? '¡Correcto!' : a === 'x' ? 'Está bien no saberlo todavía.' : 'Casi.'}</strong> ` : nothing}${q.explain}</p></div>` : nothing}
    </fieldset>`;
  }

  // ---------- Render: resultados ------------------------------------------------
  _summaryText() {
    const r = store.state.results[this._diag] || {};
    const lines = [`CEIBA · ${this.D.title}`];
    Object.entries(r).forEach(([m, v]) => {
      lines.push(`${m === 'unico' ? 'Resultado' : m === 'inicial' ? 'Inicial' : 'Cierre'} (${formatDate(v.date)}):`);
      if (this._diag === 'anual') lines.push(`  Nivel sugerido: ${LEVELS.find((l) => l.id === v.summary.level)?.label} · ${v.summary.correct}/${v.summary.total} conceptos`);
      if (this._diag === 'internacionales') v.summary.skills.forEach((k) => lines.push(`  ${k.title}: ${k.value} (${RUBRIC[k.value - 1]?.label})`));
      if (this._diag === 'semanatec') lines.push(`  Sensibilización ${v.summary.sens}/10 · Interés ${v.summary.int}/5 · Formas de incidencia ${v.summary.forms}`);
    });
    return lines.join('\n');
  }

  _delta(a, b) {
    if (a == null || b == null) return html`<span class="muted">—</span>`;
    const d = b - a;
    return html`<span class=${d > 0 ? 'up' : d < 0 ? 'down' : ''}>${d > 0 ? '+' : ''}${d}</span>`;
  }

  _result() {
    const r = store.state.results[this._diag] || {};
    const D = this.D;
    let body = nothing;
    if (this._diag === 'anual') {
      const v = r.unico?.summary;
      const lvl = LEVELS.find((l) => l.id === v?.level);
      body = html`<div class="result-level"><span class="badge">Nivel ${lvl?.label}</span>
          <p><strong>${v?.correct} de ${v?.total}</strong> conceptos clave respondidos correctamente.</p></div>
        <p>${this.s.simple ? lvl?.simple : lvl?.desc}</p>
        <p class="card soft"><strong>Para avanzar de nivel:</strong> ${lvl?.advance}</p>
        <p class="small muted">Este resultado es una sugerencia para orientar tu acompañamiento; el equipo de CEIBA lo confirma en la primera sesión.</p>
        <div class="row">
          <ui-button icon="pen" @ui-click=${() => navigate('participa')}>Inscribirme con este nivel</ui-button>
          <ui-button variant="secondary" icon="book" @ui-click=${() => navigate('programas', { anchor: 'niveles', category: 'anual' })}>Ver niveles del programa</ui-button>
        </div>`;
    } else if (this._diag === 'internacionales') {
      const ini = r.inicial?.summary; const fin = r.cierre?.summary;
      body = html`<div class="tbl"><table>
          <thead><tr><th scope="col">Habilidad</th><th scope="col">Inicial</th><th scope="col">Cierre</th><th scope="col">Cambio</th></tr></thead>
          <tbody>${PROGRAMS.internacionales.skills.map((k) => {
            const a = ini?.skills.find((x) => x.id === k.id)?.value; const b = fin?.skills.find((x) => x.id === k.id)?.value;
            return html`<tr><th scope="row">${k.title}</th><td>${a ? `${a} · ${RUBRIC[a - 1].label}` : '—'}</td><td>${b ? `${b} · ${RUBRIC[b - 1].label}` : '—'}</td><td>${this._delta(a, b)}</td></tr>`;
          })}</tbody></table></div>
        ${[ini, fin].filter(Boolean).length === 1 ? html`<p class="card soft">${ini ? 'Cuando termines las sesiones, responde el «Formulario de cierre» para ver tu avance.' : 'Aún falta el diagnóstico inicial para comparar.'}</p>` : nothing}`;
    } else {
      const ini = r.inicial?.summary; const fin = r.cierre?.summary;
      const rows = [['Sensibilización (0 a 10)', 'sens'], ['Interés (1 a 5)', 'int'], ['Formas de incidencia que puedes explicar', 'forms']];
      body = html`<div class="tbl"><table>
          <thead><tr><th scope="col">Medidor</th><th scope="col">Inicio</th><th scope="col">Cierre</th><th scope="col">Cambio</th></tr></thead>
          <tbody>${rows.map(([label, k]) => html`<tr><th scope="row">${label}</th><td>${ini?.[k] ?? '—'}</td><td>${fin?.[k] ?? '—'}</td><td>${this._delta(ini?.[k], fin?.[k])}</td></tr>`)}</tbody></table></div>
        <p class="small muted">La calidad de las propuestas se evalúa con rúbrica durante las presentaciones finales.</p>`;
    }
    return html`<div class="stage" aria-labelledby="result-title">
      <div class="row" style="justify-content:space-between"><h3 id="result-title" tabindex="-1">Tus resultados · ${D.title}</h3><span class="chip done">${icon('check', 14)} Completado</span></div>
      ${body}
      <div class="row">
        <ui-button variant="ghost" icon="copy" @ui-click=${() => copyText(this._summaryText(), 'Resumen copiado. Puedes pegarlo en tu reporte.')}>Copiar resumen</ui-button>
        ${D.moments ? html`<ui-button variant="ghost" icon="refresh" @ui-click=${() => { this._reset(); this._moment = r.inicial && !r.cierre ? 'cierre' : 'inicial'; }}>${r.inicial && !r.cierre ? 'Responder formulario de cierre' : 'Responder otra vez'}</ui-button>`
          : html`<ui-button variant="ghost" icon="refresh" @ui-click=${() => this._reset()}>Repetir diagnóstico</ui-button>`}
      </div>
      ${store.state.consent === 'accepted' ? html`<p class="small muted">Tus resultados se guardan solo en este navegador. Puedes borrarlos en «Preferencias de almacenamiento».</p>`
        : html`<p class="small muted">Tus resultados se borrarán al cerrar la página. Para conservarlos en este navegador, <a href="#" @click=${(e) => { e.preventDefault(); openLegal('cookies'); }}>permite el almacenamiento</a>.</p>`}
    </div>`;
  }

  // ---------- Render: introducción ------------------------------------------------
  _intro() {
    const D = this.D;
    const r = store.state.results[this._diag];
    return html`<div class="stage">
      <div class="stack" style="--gap:.4rem"><h3>${D.title}</h3><p class="muted">${D.subtitle} · Duración aproximada: ${D.duration}</p></div>
      <p>${D.intro}</p>
      ${this.simpleBox(D.simple)}
      ${D.moments ? html`<div class="stack" style="--gap:.5rem" role="radiogroup" aria-labelledby="mom-l">
        <span class="label" id="mom-l">¿Qué formulario vas a responder?</span>
        <div class="segmented">${D.moments.map((m) => html`<button role="radio" aria-checked=${this._moment === m.id ? 'true' : 'false'} @click=${() => { this._moment = m.id; }}>
          ${r?.[m.id] ? icon('check', 16) : nothing}${m.label}</button>`)}</div></div>` : nothing}
      ${r ? html`<p class="small"><strong>Ya tienes respuestas guardadas.</strong> <a href="#" @click=${(e) => { e.preventDefault(); this._done = true; this._step = 0; }}>Ver mis resultados</a></p>` : nothing}
      <div><ui-button size="lg" icon-end="arrowR" @ui-click=${() => { this._step = 0; this._answers = {}; this._done = false; this._focusStage(); }}>Comenzar</ui-button></div>
    </div>`;
  }

  render() {
    const D = this.D;
    const qs = D.questions;
    const q = qs[this._step];
    const answered = q && (q.type === 'scale' ? true : this._answers[q.id] !== undefined);
    return html`<article>
      ${this.head({ eyebrow: 'Diagnóstico', title: 'Descubre desde dónde empiezas', lead: 'Elige el diagnóstico de tu programa. Te toma unos minutos y te da un resultado inmediato.', simple: 'Es como un juego de preguntas. No hay calificación: solo sirve para saber qué aprender.' })}
      <section aria-labelledby="h-pick">
        <h3 id="h-pick" class="sr-only">Elige un diagnóstico</h3>
        <div class="pick" role="group" aria-label="Diagnósticos disponibles">
          ${ORDER.map((id) => { const d = DIAGNOSTICS[id]; return html`<button aria-pressed=${this._diag === id ? 'true' : 'false'} @click=${() => this._pick(id)}>
            <em>${d.duration}</em><strong>${d.title}</strong><span>${d.subtitle}</span></button>`; })}
        </div>
      </section>
      <section aria-label="Diagnóstico en curso">
        ${this._done ? this._result() : this._step < 0 ? this._intro() : html`<div class="stage">
          <ui-progress value=${this._step + 1} max=${qs.length} label="Pregunta ${this._step + 1} de ${qs.length}${D.moments ? ` · ${D.moments.find((m) => m.id === this._moment).label}` : ''}"></ui-progress>
          ${q.skill ? html`<span class="eyebrow">${q.skill}</span>` : nothing}
          ${this._question(q)}
          <div class="nav">
            <ui-button variant="ghost" icon="arrowL" @ui-click=${() => this._back()}>${this._step === 0 ? 'Volver al inicio' : 'Anterior'}</ui-button>
            <ui-button icon-end=${this._step === qs.length - 1 ? 'check' : 'arrowR'} ?disabled=${!answered} @ui-click=${() => this._next()}>${this._step === qs.length - 1 ? 'Ver resultado' : 'Siguiente'}</ui-button>
          </div>
          ${answered ? nothing : html`<p class="hint" style="text-align:right">Elige una respuesta para continuar.</p>`}
        </div>`}
      </section>
    </article>`;
  }
}
customElements.define('view-diagnostico', ViewDiagnostico);

    return super.focusAnchor(id);
  }

  _choose(sec, it) {
    store.set({ idea: { ...store.state.idea, text: this._draft, sector: sec.id, subtype: it.id } });
    toast(`Tipo elegido: ${it.title}.`, 'ok', 2500);
    this.updateComplete.then(() => this.renderRoot.querySelector('#idea')?.focus());
  }

  }

  render() {
    const s = this.s;
    const idea = s.idea || {};
    const sec = INITIATIVES.find((x) => x.id === idea.sector);
    const sub = sec?.items.find((x) => x.id === idea.subtype);
    const shown = this._filter === 'all' ? INITIATIVES : INITIATIVES.filter((x) => x.id === this._filter);
    const len = this._draft.length;
    return html`<article>
      ${this.head({ eyebrow: 'Programa Anual · tipos de iniciativas', title: '¿Desde dónde puede actuar tu idea?', lead: 'Explora los tres sectores y sus tipos de iniciativa. Elige el que mejor encaja con tu propuesta.', simple: 'Hay ideas para el gobierno, para las empresas y para ambos juntos. Mira los ejemplos y elige la que más te guste.' })}

      <section aria-labelledby="h-f">
        <h3 id="h-f" class="label" style="font-family:var(--font-body);font-size:1rem">Mostrar sector</h3>
        <div class="segmented" role="radiogroup" aria-labelledby="h-f">
          ${[{ id: 'all', title: 'Todos', icon: 'sparkle' }, ...INITIATIVES].map((x) => html`<button role="radio" aria-checked=${this._filter === x.id ? 'true' : 'false'} @click=${() => { this._filter = x.id; }}>${icon(x.icon, 18)}${x.title}</button>`)}
        </div>
      </section>

      ${shown.map((sct) => html`<section class="sector" id="sector-${sct.id}" aria-labelledby="h-${sct.id}">
        <div class="sector-head"><span class="ic">${icon(sct.icon, 26)}</span>
          <div class="stack" style="--gap:.3rem"><h3 id="h-${sct.id}">Iniciativas del ${sct.title.toLowerCase()}</h3><p class="muted">${s.simple ? sct.simple : sct.def}</p></div></div>
        <div class="grid" style="--min:240px">
          ${sct.items.map((it) => {
            const selected = idea.sector === sct.id && idea.subtype === it.id;
            return html`<div class="card item ${selected ? 'sel' : ''}">
              <div class="row" style="justify-content:space-between;--gap:.4rem"><h4>${it.title}</h4>${it.textStatus === 'prop' ? html`<span class="chip prop" title="Texto por validar con el equipo">Texto por validar</span>` : nothing}</div>
              <p>${it.text}</p>
              <p class="ex"><b>Ejemplo ilustrativo</b>${it.example}</p>
              <div>${selected ? html`<span class="chip done">${icon('check', 14)} Elegido</span>`
                : html`<ui-button variant="ghost" size="sm" a11y-label="Elegir ${it.title}" @ui-click=${() => this._choose(sct, it)}>Elegir este tipo</ui-button>`}</div>
            </div>`;
          })}
        </div>
      </section>`)}

      <section class="builder" aria-labelledby="h-b" id="mi-idea">
        <div class="stack" style="--gap:.3rem"><span class="eyebrow">Tu turno</span><h3 id="h-b">Describe tu idea en una frase</h3></div>
        <div class="picked">
          <span class="label">Tipo elegido:</span>
          ${sub ? html`<span class="chip done">${sec.title} · ${sub.title}</span>` : html`<span class="chip">Aún no eliges un tipo</span>`}
        </div>
        <div class="field">
          <label for="idea">Mi idea es…</label>
          <textarea id="idea" maxlength=${MAX} placeholder="Ej.: Proponer a mi municipio un programa de composta en mercados." aria-describedby="idea-c idea-h"
            .value=${this._draft} @input=${(e) => { this._draft = e.target.value; }}></textarea>
          <span id="idea-h" class="hint">No escribas datos personales aquí.</span>
          <span id="idea-c" class="count ${len > MAX - 20 ? 'warn' : ''}" aria-live="polite">${len} / ${MAX} caracteres</span>
        </div>
        <div class="row">
          <ui-button icon="check" @ui-click=${() => this._save()}>Guardar idea</ui-button>
          <ui-button variant="secondary" icon-end="arrowR" @ui-click=${() => { this._save(); if (this._draft.trim().length >= 10) navigate('participa'); }}>Usar en mi inscripción</ui-button>
        </div>
      </section>
    </article>`;
  }
}
customElements.define('view-iniciativas', ViewIniciativas);

const ALL = [...INDICATORS.process.s1.map((k) => ({ ...k, sem: 'Primer semestre' })), ...INDICATORS.process.s2.map((k) => ({ ...k, sem: 'Segundo semestre' }))];

class ViewIndicadores extends CeibaView {
  static properties = { _sel: { state: true }, _num: { state: true }, _den: { state: true }, _sem: { state: true }, _example: { state: true } };

  static styles = [shared, css`
    .chain { display: flex; align-items: stretch; gap: .4rem; overflow-x: auto; padding-bottom: .4rem; }
    .step { flex: 1 1 0; min-width: 150px; display: flex; flex-direction: column; gap: .35rem; padding: 1rem; border-radius: var(--radius-m);
      background: color-mix(in srgb, var(--c-primary) calc(var(--i) * 9% + 6%), var(--c-surface)); border: 1px solid var(--c-line); }
    .step:last-child { background: var(--c-primary); color: var(--c-surface); }
    .step:last-child h4 { color: var(--c-surface); }
    .step p { font-size: .9rem; }
    .arrow { flex: none; align-self: center; color: var(--c-primary); }
    @media (max-width: 760px) { .chain { flex-direction: column; overflow: visible; } .step { min-width: 0; } .arrow { transform: rotate(90deg); } }
    .types .card { display: flex; flex-direction: column; gap: .5rem; }
    .types .q { font-family: var(--font-display); font-weight: 700; color: var(--c-primary-strong); }
    ol.obj { display: grid; gap: .5rem; padding-left: 1.4rem; }
    ol.obj li + li { margin: 0; }
    .tbl { overflow-x: auto; border: 1px solid var(--c-line); border-radius: var(--radius-m); background: var(--c-surface); }
    table { width: 100%; border-collapse: collapse; min-width: 560px; }
    th, td { text-align: left; padding: .7rem .85rem; border-bottom: 1px solid var(--c-line); vertical-align: top; font-size: .95rem; }
    thead th { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--c-muted); background: var(--c-surface-2); }
    tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
    .f { font-variant-numeric: tabular-nums; color: var(--c-muted); }
    .calc { display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--radius-l); padding: 1.25rem; }
    @media (max-width: 760px) { .calc { grid-template-columns: 1fr; } }
    .two { display: grid; gap: .75rem; grid-template-columns: 1fr 1fr; }
    @media (max-width: 420px) { .two { grid-template-columns: 1fr; } }
    .out { display: flex; flex-direction: column; gap: .75rem; justify-content: center; padding: 1rem; border-radius: var(--radius-m); background: var(--c-surface-2); }
    .pct { font-family: var(--font-display); font-size: 3rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .light { display: inline-flex; align-items: center; gap: .45rem; font-weight: 800; padding: .3rem .7rem; border-radius: 999px; }
    .light.ok { background: var(--c-ok-soft); color: var(--c-ok); } .light.warn { background: var(--c-warn-soft); color: var(--c-warn); } .light.bad { background: var(--c-bad-soft); color: var(--c-bad); }
    .res .card { display: flex; flex-direction: column; gap: .6rem; }
    .res ol { padding-left: 1.2rem; color: var(--c-muted); }
  `];

  constructor() { super(); this._sel = ALL[0].id; this._num = '18'; this._den = '20'; this._sem = 's1'; this._example = true; }

  _calc() {
    const n = Number(this._num); const d = Number(this._den);
    if (this._num === '' || this._den === '') return { err: 'Escribe ambos valores para calcular.' };
    if (!Number.isFinite(n) || !Number.isFinite(d) || n < 0 || d < 0) return { err: 'Usa números positivos.' };
    if (d === 0) return { err: 'El denominador no puede ser 0.' };
    const pct = (n / d) * 100;
    const t = INDICATORS.thresholds;
    const tone = pct >= t.good ? 'ok' : pct >= t.warn ? 'warn' : 'bad';
    return { pct, tone, over: n > d };
  }

  _table(list) {
    return html`<div class="tbl"><table>
      <thead><tr><th scope="col">Indicador</th><th scope="col">Fórmula propuesta</th></tr></thead>
      <tbody>${list.map((k) => html`<tr><th scope="row">${k.title}</th><td class="f">(${k.num} ÷ ${k.den}) × 100</td></tr>`)}</tbody>
    </table></div>`;
  }

  render() {
    const k = ALL.find((x) => x.id === this._sel);
    const r = this._calc();
    const labels = { ok: 'En meta', warn: 'Atención', bad: 'Requiere acción' };
    const T = INDICATORS.thresholds;
    return html`<article>
      ${this.head({ eyebrow: 'Propuesta de medidores a largo plazo', title: 'Cómo medimos el avance y el impacto', lead: 'Un sistema de indicadores de proceso y de resultado para saber si hacemos lo que planeamos y si está cambiando la realidad.', simple: 'Contamos cosas para saber si el programa funciona, igual que un marcador en un partido.' })}

      <section id="cadena" aria-labelledby="h-ch">
        <h3 id="h-ch">Estructura lógica del programa y cadena de resultados</h3>
        <div class="chain" role="list">
          ${INDICATORS.chain.map((c, i) => html`${i ? html`<span class="arrow" aria-hidden="true">${icon('arrowR', 22)}</span>` : nothing}
            <div class="step" role="listitem" style="--i:${i}"><h4>${c.title}</h4><p>${c.text}</p></div>`)}
        </div>
      </section>

      <section aria-labelledby="h-obj">
        <h3 id="h-obj">Objetivo del sistema de indicadores</h3>
        <ol class="obj">${INDICATORS.objectives.map((o) => html`<li>${o}</li>`)}</ol>
      </section>

      <section class="types" aria-labelledby="h-ty">
        <h3 id="h-ty">Dos tipos de indicadores</h3>
        <div class="grid">${INDICATORS.types.map((t) => html`<div class="card"><h4>${t.title}</h4><p class="q">${t.question}</p><p class="muted">${t.text}</p></div>`)}</div>
      </section>

      <section id="proceso" aria-labelledby="h-pr">
        <div class="row"><h3 id="h-pr">Indicadores de proceso</h3><span class="chip prop" title="Fórmulas sugeridas, pendientes de validación">Fórmulas propuestas</span></div>
        <div class="segmented" role="tablist" aria-label="Semestre">
          <button role="tab" aria-selected=${this._sem === 's1' ? 'true' : 'false'} @click=${() => { this._sem = 's1'; }}>Primer semestre</button>
          <button role="tab" aria-selected=${this._sem === 's2' ? 'true' : 'false'} @click=${() => { this._sem = 's2'; }}>Segundo semestre</button>
        </div>
        <div role="tabpanel">${this._table(INDICATORS.process[this._sem])}</div>
      </section>

      <section id="calculadora" aria-labelledby="h-calc">
        <div class="row"><h3 id="h-calc">Calculadora de indicadores</h3>${this._example ? html`<span class="chip ex">Datos de ejemplo</span>` : nothing}</div>
        <div class="calc">
          <div class="stack">
            <div class="field">
              <label for="ind">Indicador</label>
              <select id="ind" @change=${(e) => { this._sel = e.target.value; }}>
                <optgroup label="Primer semestre">${INDICATORS.process.s1.map((x) => html`<option value=${x.id} ?selected=${x.id === this._sel}>${x.title}</option>`)}</optgroup>
                <optgroup label="Segundo semestre">${INDICATORS.process.s2.map((x) => html`<option value=${x.id} ?selected=${x.id === this._sel}>${x.title}</option>`)}</optgroup>
              </select>
            </div>
            <div class="two">
              <div class="field"><label for="num">${k.num}</label>
                <input id="num" type="number" inputmode="numeric" min="0" .value=${this._num} aria-invalid=${r.err ? 'true' : 'false'} @input=${(e) => { this._num = e.target.value; this._example = false; }} /></div>
              <div class="field"><label for="den">${k.den}</label>
                <input id="den" type="number" inputmode="numeric" min="0" .value=${this._den} aria-invalid=${r.err ? 'true' : 'false'} @input=${(e) => { this._den = e.target.value; this._example = false; }} /></div>
            </div>
            <p class="hint">Umbrales de ejemplo, ajustables en el contenido: en meta ≥ ${T.good} %, atención ${T.warn}–${T.good - 1} %, requiere acción &lt; ${T.warn} %.</p>
          </div>
          <div class="out" aria-live="polite">
            ${r.err ? html`<p class="error">${icon('alert', 18)} ${r.err}</p>` : html`
              <span class="small muted">${k.title} · ${k.sem}</span>
              <span class="pct">${r.pct.toFixed(1)} %</span>
              <ui-progress value=${Math.min(100, r.pct)} max="100" tone=${r.tone} label="Resultado del indicador"></ui-progress>
              <span><span class="light ${r.tone}">${icon(r.tone === 'ok' ? 'check' : 'alert', 16)} ${labels[r.tone]}</span></span>
              ${r.over ? html`<p class="small" style="color:var(--c-warn)">El valor supera el 100 %. Es posible en reclutamiento; en otros indicadores, revisa los datos.</p>` : nothing}`}
          </div>
        </div>
      </section>

      <section id="resultados" class="res" aria-labelledby="h-res">
        <h3 id="h-res">Indicadores de resultado e impacto</h3>
        <p class="muted">¿Está cambiando algo en la realidad que queríamos transformar?</p>
        <div class="grid" style="--min:250px">${INDICATORS.results.map((g) => html`<div class="card"><h4>${g.title}</h4><ol>${g.items.map((it) => html`<li>${it}</li>`)}</ol></div>`)}</div>
      </section>

      <section id="instrumentos" aria-labelledby="h-ins">
        <h3 id="h-ins">Instrumentos de recolección de información</h3>
        <div class="row" style="--gap:.5rem">${INDICATORS.instruments.map((x) => html`<span class="chip" style="font-size:.9rem;padding:.45rem .85rem">${icon('clipboard', 16)} ${x}</span>`)}</div>
      </section>
    </article>`;
  }
}
customElements.define('view-indicadores', ViewIndicadores);

        <div class="phead"><h3 id="h-${p.id}">${p.title}</h3><span>${p.subtitle}</span><span class="muted small">${p.months}</span></div>
        <div class="months">
          ${CALENDAR.months.filter((m) => m.period === p.id).map((m) => {
            const evs = m.events.filter(filterEv);
            return html`<div class="m ${m.m === now ? 'now' : ''}" aria-current=${m.m === now ? 'date' : nothing}>
              <h4>${m.name}${m.m === now ? html`<span class="here">Estás aquí</span>` : nothing}</h4>
              ${evs.length ? evs.map((e) => html`<button class="ev ${e.cat}" @click=${() => navigate('programas', { category: e.cat })}>${icon(CAT_ICON[e.cat], 16)}${e.label}</button>`)
                : html`<span class="none">${m.events.length ? 'Sin eventos de esta categoría' : 'Trabajo del programa'}</span>`}
            </div>`;
          })}
        </div>
      </section>`)}
    </article>`;
  }
}
customElements.define('view-calendario', ViewCalendario);

          </blockquote></figure>`)}</div>`
        : html`<div class="empty">
