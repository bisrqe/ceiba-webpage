// ===== src/views/view-participa.js =====
const AGES = ['8 a 12 años', '13 a 17 años', '18 a 24 años', '25 a 34 años', '35 a 50 años', 'Más de 50 años'];
const MINOR = new Set(AGES.slice(0, 2));
const ROLES = ['Estudiante del Tec de Monterrey', 'Estudiante de otra universidad', 'Estudiante de preparatoria o secundaria', 'Docente', 'Madre, padre o tutor', 'Aliado institucional u organización', 'Otro'];
const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const MSG_MAX = 600;

const empty = () => ({ name: '', email: '', age: '', role: '', school: '', semester: '', interests: [], level: store.state.level || '', message: '',
  tutorName: '', tutorEmail: '', tutorConsent: false, newsletter: false, privacy: false });

class ViewParticipa extends CeibaView {
  static properties = { _f: { state: true }, _errors: { state: true }, _status: { state: true }, _tried: { state: true } };

  static styles = [shared, css`
    form { display: flex; flex-direction: column; gap: 1.5rem; }
    .grp { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--radius-l); padding: clamp(1rem, 3vw, 1.5rem); display: flex; flex-direction: column; gap: 1rem; }
    .grp > h3 { display: flex; align-items: center; gap: .6rem; }
    .grp > h3 .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--c-primary); color: var(--c-surface); font-size: .9rem; }
    .cols { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
    fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; min-width: 0; }
    legend { font-weight: 700; margin-bottom: .4rem; padding: 0; }
    .req { color: var(--c-bad); }
    .tutor { border-left: 5px solid var(--c-accent); padding-left: 1rem; }
    .summary { background: var(--c-bad-soft); border-radius: var(--radius-m); padding: 1rem 1.15rem; display: flex; flex-direction: column; gap: .5rem; }
    .summary a { color: var(--c-bad); font-weight: 700; }
    .count { font-size: .85rem; color: var(--c-muted); text-align: right; font-variant-numeric: tabular-nums; }
    .consent { background: var(--c-surface-2); border-radius: var(--radius-m); padding: 1rem; display: flex; flex-direction: column; gap: .75rem; }
    .consent .choice { background: var(--c-surface); }
    .ok { display: flex; flex-direction: column; gap: 1rem; align-items: flex-start; background: var(--c-ok-soft); border-radius: var(--radius-l); padding: 1.5rem; }
    .ok .icon { color: var(--c-ok); }
    dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: .35rem 1rem; font-size: .95rem; }
    dt { font-weight: 700; } dd { margin: 0; }
    .demo { display: flex; gap: .6rem; align-items: flex-start; font-size: .92rem; padding: .75rem 1rem; border-radius: var(--radius-m); background: var(--c-sky-soft); }
  `];

  constructor() { super(); this._f = empty(); this._errors = {}; this._status = 'idle'; this._tried = false; this._prefilled = ''; this._levelTouched = false; }

  // Al abrir la vista: precarga la idea guardada en «Iniciativas» y el nivel del diagnóstico.
  willUpdate() {
    if (this.s.view !== 'participa' || this._status === 'done') return;
    const idea = store.state.idea;
    if (idea?.text && !this._f.message && this._prefilled !== idea.text) {
      const sec = INITIATIVES.find((x) => x.id === idea.sector); const sub = sec?.items.find((x) => x.id === idea.subtype);
      const interests = this._f.interests.includes('anual') ? this._f.interests : [...this._f.interests, 'anual'];
      this._f = { ...this._f, message: `Mi idea: ${idea.text}${sub ? ` (tipo: ${sec.title} · ${sub.title})` : ''}`, interests };
      this._prefilled = idea.text;
    }
    if (!this._f.level && store.state.level && !this._levelTouched) this._f = { ...this._f, level: store.state.level };
  }

  get minor() { return MINOR.has(this._f.age); }

  _set(k, v) { this._f = { ...this._f, [k]: v }; if (this._tried) this._errors = this._validate(); }
  _toggleInterest(id, on) { const s = new Set(this._f.interests); on ? s.add(id) : s.delete(id); this._set('interests', [...s]); }

  _validate() {
    const f = this._f; const e = {};
    if (f.name.trim().length < 2) e.name = 'Escribe tu nombre (al menos 2 letras).';
    if (!EMAIL.test(f.email.trim())) e.email = 'Escribe un correo válido, por ejemplo: nombre@correo.com';
    if (!f.age) e.age = 'Elige tu rango de edad.';
    if (!f.role) e.role = 'Elige la opción que te describe.';
    if (!f.interests.length) e.interests = 'Elige al menos un programa de interés.';
    if (this.minor) {
      if (f.tutorName.trim().length < 2) e.tutorName = 'Escribe el nombre de tu madre, padre o tutor.';
      if (!EMAIL.test(f.tutorEmail.trim())) e.tutorEmail = 'Escribe un correo válido de tu madre, padre o tutor.';
      if (!f.tutorConsent) e.tutorConsent = 'Se necesita la autorización de tu madre, padre o tutor.';
    }
    if (!f.privacy) e.privacy = 'Para enviar, acepta el Aviso de privacidad.';
    return e;
  }

  async _submit(ev) {
    ev.preventDefault();
    this._tried = true;
    this._errors = this._validate();
    const keys = Object.keys(this._errors);
    if (keys.length) {
      toast(`Revisa ${keys.length === 1 ? '1 campo' : `${keys.length} campos`} antes de enviar.`, 'bad');
      await this.updateComplete;
      this.renderRoot.querySelector('#err-summary')?.focus();
      return;
    }
    this._status = 'sending';
    const payload = { ...this._f, submittedAt: new Date().toISOString(), source: 'ceiba-web' };
    try {
      if (SITE.formEndpoint) {
        const res = await fetch(SITE.formEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
      } else {
        await new Promise((r) => setTimeout(r, 1100)); // Modo demostración: no se envía nada
      }
      this._status = 'done';
      if (this._f.level && this._f.level !== store.state.level) store.set({ level: this._f.level });
      toast(SITE.formEndpoint ? 'Registro enviado. Te contactaremos por correo.' : 'Registro completado (demostración: no se envió información).', 'ok', 6000);
      await this.updateComplete;
      this.renderRoot.querySelector('#ok-title')?.focus();
    } catch (err) {
      this._status = 'idle';
      toast('No pudimos enviar tu registro. Revisa tu conexión e inténtalo de nuevo.', 'bad', 7000);
    }
  }

  _err(k) { return this._errors[k] ? html`<span class="error" id="e-${k}">${icon('alert', 16)} ${this._errors[k]}</span>` : nothing; }
  _inv(k) { return this._errors[k] ? 'true' : 'false'; }
  _desc(k, extra = '') { return [this._errors[k] ? `e-${k}` : '', extra].filter(Boolean).join(' ') || nothing; }

  _done() {
    const f = this._f;
    return html`<div class="ok">
      ${icon('check', 36)}
      <h3 id="ok-title" tabindex="-1">¡Gracias, ${f.name.split(' ')[0]}! Recibimos tu registro.</h3>
      ${SITE.formEndpoint ? html`<p>Te escribiremos a <strong>${f.email}</strong>${this.minor ? html` y a <strong>${f.tutorEmail}</strong>` : nothing} con los siguientes pasos.</p>`
        : html`<p class="demo">${icon('info')}<span><strong>Modo demostración.</strong> Tus datos no salieron de este navegador y no se guardaron. En producción, este formulario se conecta al servicio definido en <code>SITE.formEndpoint</code>.</span></p>`}
      <dl>
        <dt>Programas</dt><dd>${f.interests.map((i) => CATEGORIES.find((c) => c.id === i)?.short || 'Testimonio').join(', ')}</dd>
        <dt>Nivel</dt><dd>${LEVELS.find((l) => l.id === f.level)?.label || 'Por definir en el diagnóstico'}</dd>
        <dt>Boletín</dt><dd>${f.newsletter ? 'Sí' : 'No'}</dd>
      </dl>
      <div class="row">
        <ui-button icon="calendar" @ui-click=${() => navigate('calendario')}>Ver calendario</ui-button>
        <ui-button variant="ghost" icon="refresh" @ui-click=${() => { this._f = empty(); this._errors = {}; this._tried = false; this._status = 'idle'; }}>Hacer otro registro</ui-button>
      </div>
    </div>`;
  }

  render() {
    const f = this._f; const errs = Object.entries(this._errors);
    const labels = { name: 'Nombre', email: 'Correo', age: 'Edad', role: 'Perfil', interests: 'Programas de interés', tutorName: 'Nombre del tutor', tutorEmail: 'Correo del tutor', tutorConsent: 'Autorización del tutor', privacy: 'Aviso de privacidad' };
    const firstInput = { interests: 'int-internacionales', tutorConsent: 'tutorConsent', privacy: 'privacy' };
    return html`<article>
      ${this.head({ eyebrow: 'Participa', title: 'Inscríbete o contáctanos', lead: 'Completa el formulario y te enviaremos la información del programa que elijas. Los campos con * son obligatorios.', simple: 'Escribe tu nombre y tu correo. Si eres menor de 18 años, pide ayuda a una persona adulta.' })}
      ${this._status === 'done' ? this._done() : html`
      ${SITE.formEndpoint ? nothing : html`<p class="demo">${icon('info')}<span><strong>Demostración:</strong> este formulario valida tus datos pero no los envía a ningún servidor.</span></p>`}
      <form novalidate @submit=${this._submit} aria-describedby="req-note">
        <p id="req-note" class="sr-only">Los campos marcados con asterisco son obligatorios.</p>
        ${errs.length ? html`<div class="summary" id="err-summary" tabindex="-1" role="alert">
          <strong>Hay ${errs.length === 1 ? 'un dato' : `${errs.length} datos`} por corregir:</strong>
          <ul>${errs.map(([k, m]) => html`<li><a href="#${firstInput[k] || k}" @click=${(e) => { e.preventDefault(); this.renderRoot.getElementById(firstInput[k] || k)?.focus(); }}>${labels[k]}: ${m}</a></li>`)}</ul>
        </div>` : nothing}

        <div class="grp">
          <h3><span class="n">1</span>Tus datos</h3>
          <div class="cols">
            <div class="field"><label for="name">Nombre completo <span class="req" aria-hidden="true">*</span></label>
              <input id="name" type="text" autocomplete="name" required aria-required="true" aria-invalid=${this._inv('name')} aria-describedby=${this._desc('name')} .value=${f.name} @input=${(e) => this._set('name', e.target.value)} />${this._err('name')}</div>
            <div class="field"><label for="email">Correo electrónico <span class="req" aria-hidden="true">*</span></label>
              <input id="email" type="email" autocomplete="email" inputmode="email" required aria-required="true" aria-invalid=${this._inv('email')} aria-describedby=${this._desc('email')} .value=${f.email} @input=${(e) => this._set('email', e.target.value)} />${this._err('email')}</div>
            <div class="field"><label for="age">Rango de edad <span class="req" aria-hidden="true">*</span></label>
              <select id="age" required aria-required="true" aria-invalid=${this._inv('age')} aria-describedby=${this._desc('age')} @change=${(e) => this._set('age', e.target.value)}>
                <option value="" ?selected=${!f.age}>Elige una opción</option>${AGES.map((a) => html`<option ?selected=${f.age === a}>${a}</option>`)}</select>${this._err('age')}</div>
            <div class="field"><label for="role">¿Qué te describe mejor? <span class="req" aria-hidden="true">*</span></label>
              <select id="role" required aria-required="true" aria-invalid=${this._inv('role')} aria-describedby=${this._desc('role')} @change=${(e) => this._set('role', e.target.value)}>
                <option value="" ?selected=${!f.role}>Elige una opción</option>${ROLES.map((r) => html`<option ?selected=${f.role === r}>${r}</option>`)}</select>${this._err('role')}</div>
            <div class="field"><label for="school">Carrera, escuela u organización</label>
              <input id="school" type="text" autocomplete="organization" .value=${f.school} @input=${(e) => this._set('school', e.target.value)} /></div>
            ${f.role.startsWith('Estudiante') ? html`<div class="field"><label for="semester">Semestre o grado</label>
              <select id="semester" @change=${(e) => this._set('semester', e.target.value)}><option value="">Prefiero no decir</option>
                ${Array.from({ length: 10 }, (_, i) => `${i + 1}.º`).map((x) => html`<option ?selected=${f.semester === x}>${x}</option>`)}<option ?selected=${f.semester === 'Otro'}>Otro</option></select></div>` : nothing}
          </div>
        </div>

        ${this.minor ? html`<div class="grp tutor" aria-labelledby="h-tutor">
          <h3 id="h-tutor"><span class="n">!</span>Autorización de madre, padre o tutor</h3>
          <p class="muted">Por ser menor de 18 años, la ley requiere el consentimiento de tu madre, padre o tutor para tratar tus datos.</p>
          <div class="cols">
            <div class="field"><label for="tutorName">Nombre del tutor <span class="req" aria-hidden="true">*</span></label>
              <input id="tutorName" type="text" aria-required="true" aria-invalid=${this._inv('tutorName')} aria-describedby=${this._desc('tutorName')} .value=${f.tutorName} @input=${(e) => this._set('tutorName', e.target.value)} />${this._err('tutorName')}</div>
            <div class="field"><label for="tutorEmail">Correo del tutor <span class="req" aria-hidden="true">*</span></label>
              <input id="tutorEmail" type="email" inputmode="email" aria-required="true" aria-invalid=${this._inv('tutorEmail')} aria-describedby=${this._desc('tutorEmail')} .value=${f.tutorEmail} @input=${(e) => this._set('tutorEmail', e.target.value)} />${this._err('tutorEmail')}</div>
          </div>
          <label class="choice"><input id="tutorConsent" type="checkbox" .checked=${f.tutorConsent} aria-invalid=${this._inv('tutorConsent')} aria-describedby=${this._desc('tutorConsent')} @change=${(e) => this._set('tutorConsent', e.target.checked)} />
            <span>Como madre, padre o tutor, autorizo el tratamiento de los datos de la persona menor de edad conforme al Aviso de privacidad. <span class="req" aria-hidden="true">*</span></span></label>${this._err('tutorConsent')}
        </div>` : nothing}

        <div class="grp">
          <h3><span class="n">2</span>Tu interés</h3>
          <fieldset aria-invalid=${this._inv('interests')} aria-describedby=${this._desc('interests')}>
            <legend>Programas de interés <span class="req" aria-hidden="true">*</span> <span class="hint">(elige uno o más)</span></legend>
            <div class="cols" style="gap:.5rem">
              ${[...CATEGORIES.filter((c) => c.id !== 'todas'), { id: 'testimonio', label: 'Compartir mi experiencia como participante' }].map((c) => html`<label class="choice">
                <input id="int-${c.id}" type="checkbox" .checked=${f.interests.includes(c.id)} @change=${(e) => this._toggleInterest(c.id, e.target.checked)} /><span>${c.label}</span></label>`)}
            </div>
            ${this._err('interests')}
          </fieldset>
          <fieldset>
            <legend>Tu nivel (si ya lo conoces)</legend>
            <div class="cols" style="gap:.5rem">
              ${[{ id: '', label: 'Aún no lo sé' }, ...LEVELS].map((l) => html`<label class="choice"><input type="radio" name="flevel" .checked=${f.level === l.id} @change=${() => { this._levelTouched = true; this._set('level', l.id); }} /><span>${l.label}</span></label>`)}
            </div>
            <span class="hint">¿No lo sabes? <a href="#diagnostico" @click=${(e) => { e.preventDefault(); navigate('diagnostico', { category: 'anual' }); }}>Haz el diagnóstico de entrada</a>.</span>
          </fieldset>
          <div class="field"><label for="message">Mensaje o idea de iniciativa</label>
            <textarea id="message" maxlength=${MSG_MAX} aria-describedby="msg-c" .value=${f.message} @input=${(e) => this._set('message', e.target.value)}></textarea>
            <span id="msg-c" class="count" aria-live="polite">${f.message.length} / ${MSG_MAX}</span></div>
        </div>

        <div class="grp">
          <h3><span class="n">3</span>Privacidad y consentimiento</h3>
          <div class="consent">
            <ui-switch label="Quiero recibir el boletín de CEIBA" description="Opcional. Es una finalidad secundaria: puedes darte de baja cuando quieras." ?checked=${f.newsletter} @ui-change=${(e) => this._set('newsletter', e.detail.checked)}></ui-switch>
            <label class="choice"><input id="privacy" type="checkbox" .checked=${f.privacy} aria-invalid=${this._inv('privacy')} aria-describedby=${this._desc('privacy')} @change=${(e) => this._set('privacy', e.target.checked)} />
              <span>He leído el <a href="#" @click=${(e) => { e.preventDefault(); openLegal('privacidad'); }}>Aviso de privacidad</a> y acepto el tratamiento de mis datos para las finalidades necesarias de inscripción y contacto. <span class="req" aria-hidden="true">*</span></span></label>
            ${this._err('privacy')}
          </div>
        </div>

        ${this._status === 'sending' ? html`<ui-progress indeterminate label="Enviando tu registro…"></ui-progress>` : nothing}
        <div class="row">
          <ui-button type="submit" size="lg" icon="check" ?disabled=${this._status === 'sending'}>${this._status === 'sending' ? 'Enviando…' : 'Enviar registro'}</ui-button>
          <ui-button type="reset" variant="ghost" @ui-click=${() => { this._f = empty(); this._errors = {}; this._tried = false; toast('Formulario limpio.', 'info', 2000); }}>Limpiar</ui-button>
        </div>
      </form>`}
    </article>`;
  }
}
customElements.define('view-participa', ViewParticipa);

// ===== src/app.js =====
/**
 * <ceiba-app> · Contenedor principal (layout + enrutador + ventanas legales + consentimiento).
 * Estructura: Cabecera · Barra lateral · Cuerpo (vistas) · Pie de página.
 * Todas las vistas permanecen montadas (ocultas con `hidden`) para conservar lo que la
 * persona escribió al cambiar de sección.
 */
const VIEW_TAGS = {
  inicio: 'view-inicio', nosotros: 'view-nosotros', programas: 'view-programas', diagnostico: 'view-diagnostico',
  iniciativas: 'view-iniciativas', indicadores: 'view-indicadores', calendario: 'view-calendario',
  testimonios: 'view-testimonios', participa: 'view-participa',
};

class CeibaApp extends LitElement {
  static properties = { _legal: { state: true } };

  static styles = [shared, css`
    :host { display: block; min-height: 100%; background: var(--c-bg); }
    .skip { position: absolute; left: 16px; top: -100px; z-index: 100; background: var(--c-ink); color: var(--c-bg); padding: .75rem 1rem; border-radius: var(--radius-s); font-weight: 800; text-decoration: none; }
    .skip:focus { top: calc(8px + env(safe-area-inset-top, 0px)); }
    .layout { max-width: var(--maxw); margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); padding-block: 1.5rem 1rem;
      display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 2rem; align-items: start; }
    aside { position: sticky; top: calc(var(--header-h) + 16px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - var(--header-h) - 32px); overflow: auto;
      scrollbar-width: thin; padding: 2px; border-radius: var(--radius-m); }
    main { min-width: 0; outline: none; }
    @media (max-width: 1040px) { .layout { grid-template-columns: 1fr; gap: 1.25rem; } aside { position: static; max-height: none; overflow: visible; } }
    .legal h3 { font-size: 1.05rem; margin-top: 1.1rem; margin-bottom: .35rem; }
    .legal p + p, .legal ul { margin-top: .5rem; }
    .legal .draft { display: flex; gap: .5rem; padding: .7rem .9rem; border-radius: var(--radius-s); background: var(--c-warn-soft); color: var(--c-ink); font-size: .92rem; margin-bottom: .5rem; }
    .legal table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    .legal th, .legal td { text-align: left; padding: .5rem; border-bottom: 1px solid var(--c-line); vertical-align: top; }
    .legal .tbl { overflow-x: auto; }
    .banner { position: fixed; z-index: 80; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 760px; margin: 0 auto;
      background: var(--c-surface); color: var(--c-ink); border: 1px solid var(--c-line); border-radius: var(--radius-l); box-shadow: var(--shadow-2);
      padding: 1rem 1.15rem; display: flex; flex-wrap: wrap; gap: .75rem 1rem; align-items: center; }
    .banner p { flex: 1 1 320px; font-size: .95rem; }
    .banner .icon { color: var(--c-primary); }
  `];

  constructor() {
    super();
    this._sc = new StoreController(this);
    this._legal = '';
    this._onNav = (e) => this._afterNav(e.detail);
    this._onLegal = (e) => { this._legal = e.detail.id; };
    this._onPop = () => {
      const v = location.hash.replace('#', '');
      if (store.views.includes(v) && v !== store.state.view) navigate(v);
    };
  }

  connectedCallback() {
    super.connectedCallback();
    window.addEventListener('ceiba-navigated', this._onNav);
    window.addEventListener('ceiba-legal', this._onLegal);
    window.addEventListener('popstate', this._onPop);
    window.addEventListener('hashchange', this._onPop);
    if (!document.documentElement.lang) document.documentElement.lang = 'es-MX';
    this._setTitle();
  }
  disconnectedCallback() {
    window.removeEventListener('ceiba-navigated', this._onNav);
    window.removeEventListener('ceiba-legal', this._onLegal);
    window.removeEventListener('popstate', this._onPop);
    window.removeEventListener('hashchange', this._onPop);
    super.disconnectedCallback();
  }

  _setTitle() {
    const n = NAV.find((x) => x.id === store.state.view);
    document.title = n && n.id !== 'inicio' ? `${n.label} · ${SITE.name}` : `${SITE.name} · ${SITE.fullName}`;
  }

  async _afterNav({ view, anchor }) {
    await this.updateComplete;
    this._setTitle();
    const el = this.renderRoot.querySelector(VIEW_TAGS[view]);
    if (!el) return;
    await el.updateComplete;
    if (anchor) {
      const found = await el.focusAnchor(anchor);
      if (found) return;
    }
    const main = this.renderRoot.querySelector('main');
    const top = main.getBoundingClientRect().top + window.scrollY - 90;
    window.scrollTo({ top: Math.max(0, top), behavior: store.state.reduceMotion ? 'auto' : 'smooth' });
    el.focusAnchor('');
  }

  // ---------- Ventanas legales (BORRADORES para revisión jurídica) --------------------
  _pending(v) { return v || html`<span class="chip pending">Por definir</span>`; }

  _legalContent(id) {
    const draft = html`<p class="draft">${icon('alert', 18)}<span><strong>Borrador para revisión jurídica.</strong> Sustituye los campos «Por definir» y valida el texto con el área legal antes de publicar.</span></p>`;
    const c = SITE.contact;
    switch (id) {
      case 'privacidad': return { title: 'Aviso de privacidad integral', body: html`${draft}
        <p>Este aviso se elabora conforme a la Ley Federal de Protección de Datos Personales en Posesión de los Particulares (publicada en el Diario Oficial de la Federación el 20 de marzo de 2025).</p>
        <h3>Responsable</h3><p>${this._pending(SITE.privacyController)}, con domicilio en ${this._pending(c.address)}, es responsable del tratamiento de tus datos personales.</p>
        <h3>Datos que recabamos</h3><p>Nombre, correo electrónico, rango de edad, perfil, carrera o institución, semestre, programas de interés, nivel de participante y el mensaje que escribas. Si eres menor de 18 años: nombre y correo de tu madre, padre o tutor y su autorización. No solicitamos datos personales sensibles.</p>
        <h3>Finalidades necesarias</h3><ul><li>Registrar tu inscripción y contactarte sobre el programa elegido.</li><li>Asignar tu nivel y acompañamiento.</li><li>Generar estadísticas agregadas y anónimas de los indicadores del programa.</li></ul>
        <h3>Finalidad secundaria (opcional)</h3><p>Enviarte el boletín de CEIBA, solo si activas el conmutador correspondiente. Puedes negarte o revocar esta finalidad en cualquier momento sin afectar tu inscripción.</p>
        <h3>Transferencias</h3><p>No transferimos tus datos a terceros sin tu consentimiento, salvo las excepciones que marca la ley.</p>
        <h3>Derechos ARCO y revocación</h3><p>Puedes acceder, rectificar, cancelar u oponerte al tratamiento de tus datos, así como revocar tu consentimiento, escribiendo a ${this._pending(c.email)}. Responderemos en los plazos que establece la ley.</p>
        <h3>Datos en este navegador</h3><p>Tus preferencias y resultados del diagnóstico se guardan en tu propio navegador solo si lo permites, y puedes borrarlos desde «Preferencias de almacenamiento». Este sitio no usa cookies de rastreo ni herramientas de analítica.</p>
        <h3>Cambios al aviso</h3><p>Publicaremos cualquier cambio en esta misma sección. Última actualización: ${SITE.lastUpdate}.</p>` };
      case 'terminos': return { title: 'Términos de uso', body: html`${draft}
        <p>El contenido de este sitio es informativo y educativo. Los resultados de los diagnósticos son orientativos y el equipo de CEIBA los confirma con cada participante.</p>
        <p>Las metas (por ejemplo, la visión) y las propuestas (por ejemplo, fórmulas de indicadores) se identifican con etiquetas y no constituyen resultados alcanzados.</p>
        <p>Los textos, ilustraciones y la marca CEIBA pertenecen a sus titulares. Consulta los créditos de imágenes para conocer autores y licencias.</p>` };
      case 'accesibilidad': return { title: 'Declaración de accesibilidad', body: html`
        <p>Diseñamos este sitio con la meta de cumplir las Pautas de Accesibilidad para el Contenido Web (WCAG) 2.2, nivel AA. Aún no cuenta con una auditoría externa.</p>
        <h3>Qué incluye</h3><ul>
          <li>Navegación completa con teclado, enlace «Saltar al contenido» y foco visible.</li>
          <li>Texto alternativo en imágenes informativas; las decorativas se ocultan a lectores de pantalla.</li>
          <li>Etiquetas visibles en todos los campos y mensajes de error que explican cómo corregir.</li>
          <li>Tamaño de letra ajustable (90 % a 150 %), alto contraste, reducción de movimiento y tema oscuro automático.</li>
          <li>Modo sencillo con explicaciones para niñas y niños, y lectura en voz alta de cada sección.</li>
          <li>El estado nunca depende solo del color: siempre lleva texto o icono.</li></ul>
        <h3>¿Encontraste una barrera?</h3><p>Escríbenos a ${this._pending(c.email)} indicando la página y el problema.</p>` };
      case 'terceros': return { title: 'Integraciones de terceros', body: html`
        <p>Este sitio no incluye publicidad, píxeles de seguimiento, analítica ni redes sociales incrustadas. Solo carga estos recursos externos:</p>
        <div class="tbl"><table><thead><tr><th>Servicio</th><th>Para qué</th><th>Qué recibe</th></tr></thead><tbody>
          <tr><td>jsDelivr (CDN)</td><td>Entregar la librería Lit (componentes) y qrcode-generator (solo al generar un QR)</td><td>Dirección IP y datos técnicos del navegador</td></tr>
          <tr><td>Google Fonts</td><td>Tipografías Bricolage Grotesque y Atkinson Hyperlegible</td><td>Dirección IP y datos técnicos del navegador</td></tr>
          <tr><td>Servicio del formulario</td><td>Recibir inscripciones (${SITE.formEndpoint ? 'activo' : 'desactivado en esta demostración'})</td><td>Los datos que envíes en el formulario</td></tr>
        </tbody></table></div>
        <p>Para eliminar estas dependencias en producción, aloja Lit, la librería QR y las fuentes en tu propio servidor (ver README).</p>` };
      case 'creditos': return { title: 'Créditos de imágenes', body: html`
        <div class="tbl"><table><thead><tr><th>Recurso</th><th>Autor / fuente</th><th>Licencia</th></tr></thead><tbody>
          ${SITE.imageCredits.map((cr) => html`<tr><td>${cr.asset}</td><td>${this._pending(cr.author)}</td><td>${this._pending(cr.license)}</td></tr>`)}
        </tbody></table></div>
        <p>Toda fotografía que se agregue debe incluir autor, fuente, licencia y, si aparecen personas, su autorización de uso de imagen (y la de su tutor si es menor de edad).</p>` };
      case 'testimonios': return { title: 'Política de testimonios', body: html`
        <ul><li>Solo publicamos testimonios de participantes reales que lo autorizaron por escrito.</li>
          <li>Cada testimonio indica nombre, cohorte, fuente y fecha de consentimiento.</li>
          <li>No publicamos reseñas anónimas, pagadas, incentivadas, inventadas ni generadas con inteligencia artificial.</li>
          <li>No editamos el sentido de un testimonio; solo corregimos ortografía con permiso.</li>
          <li>Retiramos un testimonio en un máximo de 5 días hábiles si la persona lo solicita o si no se puede verificar.</li></ul>` };
      case 'editorial': return { title: 'Política editorial', body: html`
        <p>Cada afirmación del sitio se clasifica para evitar afirmaciones sin respaldo:</p>
        <ul><li><span class="chip done">Realizado</span> Hecho documentado por el equipo (por ejemplo, la capacitación hacia SB64).</li>
          <li><span class="chip meta">Meta</span> Aspiración del programa, no un logro (por ejemplo, la visión).</li>
          <li><span class="chip prop">Propuesta</span> Diseño aún no validado (por ejemplo, fórmulas y umbrales de indicadores).</li>
          <li><span class="chip ex">Ejemplo ilustrativo</span> Caso hipotético para explicar un concepto.</li></ul>
        <p>No publicamos cifras de impacto sin su fuente. Si detectas un dato sin respaldo, escríbenos a ${this._pending(c.email)}.</p>` };
      case 'cookies': return { title: 'Preferencias de almacenamiento', body: html`
        <p>Podemos recordar en este navegador tu tamaño de letra, modo sencillo, contraste, nivel, ruta y resultados de diagnóstico. Nada de esto se envía a ningún servidor.</p>
        <p>Estado actual: <strong>${store.state.consent === 'accepted' ? 'Permitido' : store.state.consent === 'rejected' ? 'Solo lo esencial' : 'Sin decidir'}</strong>.</p>
        <div class="row" style="margin-top:1rem">
          <ui-button icon="check" @ui-click=${() => { store.setConsent('accepted'); toast('Guardaremos tus preferencias en este navegador.', 'ok'); }}>Permitir</ui-button>
          <ui-button variant="secondary" @ui-click=${() => { store.setConsent('rejected'); toast('Solo usaremos lo esencial. Borramos tus datos guardados.', 'info'); }}>Solo lo esencial</ui-button>
          <ui-button variant="danger" icon="close" @ui-click=${() => { store.clearAll(); toast('Borramos todos tus datos de este navegador.', 'ok'); }}>Borrar mis datos</ui-button>
        </div>` };
      default: return null;
    }
  }

  _banner() {
    if (store.state.consent) return nothing;
    return html`<div class="banner" role="region" aria-label="Aviso de almacenamiento">
      ${icon('shield', 26)}
      <p>¿Podemos recordar tus preferencias (letra, modo sencillo, resultados) <strong>solo en este navegador</strong>? No usamos cookies de rastreo ni analítica. <a href="#" @click=${(e) => { e.preventDefault(); openLegal('privacidad'); }}>Aviso de privacidad</a></p>
      <div class="row" style="--gap:.5rem">
        <ui-button size="sm" @ui-click=${() => { store.setConsent('accepted'); toast('Listo. Recordaremos tus preferencias.', 'ok'); }}>Permitir</ui-button>
        <ui-button size="sm" variant="ghost" @ui-click=${() => { store.setConsent('rejected'); toast('Entendido. No guardaremos nada.', 'info'); }}>Solo lo esencial</ui-button>
      </div>
    </div>`;
  }

  render() {
    const s = store.state;
    const legal = this._legal ? this._legalContent(this._legal) : null;
    return html`
      <a class="skip" href="#main" @click=${(e) => { e.preventDefault(); this.renderRoot.querySelector('main')?.focus(); }}>Saltar al contenido</a>
      <ceiba-header></ceiba-header>
      <div class="layout">
        <aside aria-label="Barra lateral: recorrido, filtros y accesibilidad"><ceiba-sidebar></ceiba-sidebar></aside>
        <main id="main" tabindex="-1">
          ${Object.entries(VIEW_TAGS).map(([id, tag]) => {
            const hidden = s.view !== id;
            switch (tag) {
              case 'view-inicio': return html`<view-inicio ?hidden=${hidden}></view-inicio>`;
              case 'view-nosotros': return html`<view-nosotros ?hidden=${hidden}></view-nosotros>`;
              case 'view-programas': return html`<view-programas ?hidden=${hidden}></view-programas>`;
              case 'view-diagnostico': return html`<view-diagnostico ?hidden=${hidden}></view-diagnostico>`;
              case 'view-iniciativas': return html`<view-iniciativas ?hidden=${hidden}></view-iniciativas>`;
              case 'view-indicadores': return html`<view-indicadores ?hidden=${hidden}></view-indicadores>`;
              case 'view-calendario': return html`<view-calendario ?hidden=${hidden}></view-calendario>`;
              case 'view-testimonios': return html`<view-testimonios ?hidden=${hidden}></view-testimonios>`;
              default: return html`<view-participa ?hidden=${hidden}></view-participa>`;
            }
          })}
        </main>
      </div>
      <ceiba-footer></ceiba-footer>
      <ui-modal ?open=${!!legal} heading=${legal?.title || ''} @ui-close=${() => { this._legal = ''; }}>
        <div class="legal">${legal?.body || nothing}</div>
      </ui-modal>
      ${this._banner()}
      <ui-toast-stack></ui-toast-stack>`;
  }
}
customElements.define('ceiba-app', CeibaApp);

// Exponer utilidades para integraciones externas (CMS, otras apps, consola):
window.CEIBA = { store, navigate, toast, openLegal, legal: LEGAL_LINKS.map((l) => l.id) };

</script>
